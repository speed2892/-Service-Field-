<script>
/* =====================================================================
   Core: Firebase 연결 · 로그인 · 관리자 · 공유 명단 · 예약
   두 화면(iframe)은 window.parent.Core 로 이 객체를 함께 씁니다.
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCHFEYiFasBkjbBpIrQWNfKM2ZmsWVpsfM",
  authDomain: "fieled-service.firebaseapp.com",
  projectId: "fieled-service",
  storageBucket: "fieled-service.firebasestorage.app",
  messagingSenderId: "169342378954",
  appId: "1:169342378954:web:2f9b09a1d93d7a3e926533"
};
const ADMIN_EMAIL_DOMAIN = 'admins.fieled-service.app';

const Core = (() => {
  const C = {
    db:null, auth:null, FieldValue:null, user:null,
    authAvailable:true,           // 익명 로그인이 켜져 있는지
    isAdmin:false, adminName:'', legacyAdmin:null,
    roster:null, couples:[],      // null = 아직 불러오는 중
    settings:{leaders:{}, weeklyLeaders:{}},
    adminsDoc:{exists:false, uids:[], names:{}, legacy:[]},
    reservations:[], conn:'wait', started:false
  };
  const handlers = {};
  C.on = (evt, fn) => { (handlers[evt] ||= []).push(fn); };
  C.emit = (evt, ...args) => (handlers[evt] || []).forEach(fn => { try { fn(...args); } catch (e) { console.error('[Core:'+evt+']', e); } });

  // ── 공통 도구 ──
  C.esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  C.toKey = (y,m,d) => `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  C.todayKey = () => { const t = new Date(); return C.toKey(t.getFullYear(), t.getMonth()+1, t.getDate()); };
  C.addDays = (key, n) => { const [y,m,d] = key.split('-').map(Number); const t = new Date(y, m-1, d+n); return C.toKey(t.getFullYear(), t.getMonth()+1, t.getDate()); };
  C.dowOf = key => { const [y,m,d] = key.split('-').map(Number); return new Date(y, m-1, d).getDay(); };
  C.isDateKey = s => /^\d{4}-\d{2}-\d{2}$/.test(String(s));
  C.deviceId = (() => { try { let v = localStorage.getItem('deviceId'); if (!v) { v = 'd' + Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('deviceId', v); } return v; } catch { return 'nodevice'; } })();
  C.status = (text, kind) => C.emit('status', text, kind || 'info');

  // ── 명단 도우미 ──
  C.member = name => (C.roster || []).find(m => m.name === name) || null;
  C.genderOf = name => (C.member(name) || {}).gender || 'U';          // 'M' | 'F' | 'U'
  C.hasCar = name => !!(C.member(name) || {}).car;
  C.spouseOf = name => { for (const c of C.couples) { if (c.a === name) return c.b; if (c.b === name) return c.a; } return null; };

  // ── SHA-256 (비밀번호 해시용, 외부 의존 없음) ──
  function sha256hex(str){
    const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
    const bytes=new TextEncoder().encode(str); const l=bytes.length; const n=((l+9+63)>>6)<<6; const b=new Uint8Array(n); b.set(bytes); b[l]=0x80;
    const dv=new DataView(b.buffer); dv.setUint32(n-4,(l*8)>>>0); dv.setUint32(n-8,Math.floor(l/0x20000000));
    let h=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]; const w=new Uint32Array(64);
    const r=(x,k)=>(x>>>k)|(x<<(32-k));
    for(let o=0;o<n;o+=64){
      for(let i=0;i<16;i++) w[i]=dv.getUint32(o+i*4);
      for(let i=16;i<64;i++){const s0=r(w[i-15],7)^r(w[i-15],18)^(w[i-15]>>>3), s1=r(w[i-2],17)^r(w[i-2],19)^(w[i-2]>>>10); w[i]=(w[i-16]+s0+w[i-7]+s1)>>>0;}
      let [a,bb,c,d,e,f,g,hh]=h;
      for(let i=0;i<64;i++){const S1=r(e,6)^r(e,11)^r(e,25), ch=(e&f)^(~e&g), t1=(hh+S1+ch+K[i]+w[i])>>>0, S0=r(a,2)^r(a,13)^r(a,22), mj=(a&bb)^(a&c)^(bb&c), t2=(S0+mj)>>>0; hh=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=bb;bb=a;a=(t1+t2)>>>0;}
      h=h.map((v,i)=>(v+[a,bb,c,d,e,f,g,hh][i])>>>0);
    }
    return h.map(v=>v.toString(16).padStart(8,'0')).join('');
  }
  const randHex = n => Array.from(crypto.getRandomValues(new Uint8Array(n)), x => x.toString(16).padStart(2,'0')).join('');
  const hashPw = (salt, pw) => sha256hex(salt + '|' + pw);
  C._sha256hex = sha256hex;
  // 관리자 이름 → Firebase 로그인용 이메일 (한글 이름을 16진수로 바꿈)
  const adminEmail = name => 'a' + Array.from(new TextEncoder().encode(name), x => x.toString(16).padStart(2,'0')).join('') + '@' + ADMIN_EMAIL_DOMAIN;

  // ── Firebase 시작 ──
  C.init = () => {
    if (typeof firebase === 'undefined') { C.conn = 'err'; C.status('Firebase를 불러오지 못했어요 · 인터넷 연결을 확인하세요', 'err'); return; }
    firebase.initializeApp(FIREBASE_CONFIG);
    C.db = firebase.firestore(); C.auth = firebase.auth(); C.FieldValue = firebase.firestore.FieldValue;
    C.auth.onAuthStateChanged(async user => {
      C.user = user;
      if (!user) {
        try { await C.auth.signInAnonymously(); return; }       // 다시 onAuthStateChanged 로 들어옴
        catch (e) {
          C.authAvailable = false;
          console.warn('익명 로그인이 꺼져 있어 로그인 없이 연결합니다:', e.code || e.message);
        }
      }
      recomputeAdmin();
      if (!C.started) startData();
      C.emit('auth', C.user);
    });
  };

  function snapErr(label){ return err => { console.error(label, err); C.conn = 'err'; C.status('연결 오류 (' + label + '): ' + (err.code || err.message), 'err'); C.emit('conn', 'err'); }; }
  function markOk(){ if (C.conn !== 'ok') { C.conn = 'ok'; C.status('실시간 연결됨' + (C.authAvailable ? '' : ' · 익명 로그인 꺼짐(안내서 참고)'), C.authAvailable ? 'ok' : 'warn'); C.emit('conn', 'ok'); } }

  const loaded = {settings:false, admins:false};
  function startData(){
    C.started = true;
    const cfg = C.db.collection('config');
    cfg.doc('settings').onSnapshot(snap => {
      const s = snap.exists ? snap.data() : {};
      C.settings = { leaders: s.leaders || {}, weeklyLeaders: s.weeklyLeaders || {}, lastCleanup: s.lastCleanup || '' };
      C._plainAdmins = Array.isArray(s.admins) ? s.admins : null;   // 예전 평문 비밀번호 목록
      loaded.settings = true; markOk(); maybeConvertPlainAdmins();
      C.emit('settings', C.settings);
    }, snapErr('설정'));
    cfg.doc('admins').onSnapshot(snap => {
      const d = snap.exists ? snap.data() : {};
      C.adminsDoc = { exists: snap.exists, uids: Array.isArray(d.uids) ? d.uids : [], names: d.names || {}, legacy: Array.isArray(d.legacy) ? d.legacy : [] };
      loaded.admins = true; recomputeAdmin(); maybeConvertPlainAdmins();
      C.emit('admins', C.adminsDoc);
    }, snapErr('관리자'));
    cfg.doc('roster').onSnapshot(snap => {
      const d = snap.exists ? snap.data() : null;
      C.roster = d && Array.isArray(d.members) ? d.members.filter(m => m && m.name).map(m => ({ name:String(m.name), gender:['M','F'].includes(m.gender) ? m.gender : 'U', group:m.group || '', role:m.role || '', car:!!m.car })) : [];
      C.roster.sort((a,b) => a.name.localeCompare(b.name, 'ko'));
      C.rosterExists = !!d;
      C.couples = d && Array.isArray(d.couples) ? d.couples.filter(c => c && c.a && c.b) : [];
      C.emit('roster', C.roster);
    }, snapErr('명단'));
    C.db.collection('reservations').onSnapshot(snap => {
      C.reservations = snap.docs.map(d => ({ _id:d.id, ...d.data() })).filter(r => C.isDateKey(r.dateKey) && r.name);
      markOk();
      C.emit('reservations', C.reservations);
    }, snapErr('예약'));
  }

  // 예전 방식(설정 문서에 평문 비밀번호)을 발견하면 즉시 해시로 바꾸고 평문을 지움
  let converting = false;
  async function maybeConvertPlainAdmins(){
    if (converting || !loaded.settings || !loaded.admins || !C._plainAdmins) return;
    converting = true;
    try {
      const legacy = [...C.adminsDoc.legacy];
      for (const a of C._plainAdmins) {
        if (!a || !a.name || !a.pw || legacy.some(x => x.name === a.name)) continue;
        const salt = randHex(8);
        legacy.push({ name:String(a.name), salt, hash:hashPw(salt, String(a.pw)) });
      }
      const payload = { legacy };
      if (!C.adminsDoc.exists) { payload.uids = []; payload.names = {}; }
      await C.db.collection('config').doc('admins').set(payload, { merge:true });
      await C.db.collection('config').doc('settings').update({ admins: C.FieldValue.delete() });
      console.info('관리자 비밀번호를 평문에서 해시로 옮겼습니다.');
    } catch (e) { console.warn('평문 비밀번호 이전 실패(규칙 적용 후에는 관리자 로그인 시 이전됩니다):', e.code || e.message); }
    finally { converting = false; }
  }

  function recomputeAdmin(){
    const u = C.user;
    const real = !!(u && !u.isAnonymous && C.adminsDoc.uids.includes(u.uid));
    const was = C.isAdmin + '|' + C.adminName;
    C.isAdmin = real || !!C.legacyAdmin;
    C.adminName = real ? (C.adminsDoc.names[u.uid] || '관리자') : (C.legacyAdmin ? C.legacyAdmin.name : '');
    if (was !== C.isAdmin + '|' + C.adminName) C.emit('admin', C.isAdmin, C.adminName);
  }
  C.hasAnyAdmin = () => C.adminsDoc.uids.length > 0 || C.adminsDoc.legacy.length > 0 || (C._plainAdmins || []).length > 0;
  C.adminList = () => [
    ...C.adminsDoc.uids.map(uid => ({ id:uid, name:C.adminsDoc.names[uid] || '(이름 없음)', legacy:false })),
    ...C.adminsDoc.legacy.map(l => ({ id:'legacy:' + l.name, name:l.name, legacy:true }))
  ];

  async function addAdminUid(uid, name){
    const ref = C.db.collection('config').doc('admins');
    await C.db.runTransaction(async tx => {
      const s = await tx.get(ref); const d = s.exists ? s.data() : {};
      const uids = Array.isArray(d.uids) ? [...d.uids] : [];
      if (!uids.includes(uid)) uids.push(uid);
      const names = { ...(d.names || {}), [uid]: name };
      const legacy = (Array.isArray(d.legacy) ? d.legacy : []).filter(l => l.name !== name);
      tx.set(ref, { uids, names, legacy });
    });
  }
  const authOff = e => ['auth/operation-not-allowed','auth/admin-restricted-operation','auth/configuration-not-found'].includes(e && e.code);
  async function backToAnon(){ try { await C.auth.signOut(); } catch {} }

  // ── 관리자 로그인 ──  결과: {ok, msg, warn}
  C.adminLogin = async (name, pw) => {
    name = String(name || '').trim(); pw = String(pw || '');
    if (!name || !pw) return { ok:false, msg:'이름과 비밀번호를 입력하세요' };
    if (!C.db) return { ok:false, msg:'아직 연결되지 않았어요' };
    const email = adminEmail(name);
    let signErr = null;
    // 1) Firebase 보안 로그인
    try {
      const cred = await C.auth.signInWithEmailAndPassword(email, pw);
      if (C.adminsDoc.uids.includes(cred.user.uid)) { C.legacyAdmin = null; recomputeAdmin(); return { ok:true }; }
      if (!C.hasAnyAdmin()) { await addAdminUid(cred.user.uid, name); recomputeAdmin(); return { ok:true }; }
      await backToAnon();
      return { ok:false, msg:'관리자 목록에 없는 계정이에요. 다른 관리자에게 등록을 부탁하세요.' };
    } catch (e) { signErr = e; }
    // 2) 예전 방식 관리자 → 보안 로그인으로 옮기기
    const leg = C.adminsDoc.legacy.find(l => l.name === name);
    const plain = (C._plainAdmins || []).find(a => a && a.name === name);
    const legacyOk = leg ? hashPw(leg.salt, pw) === leg.hash : (plain ? plain.pw === pw : false);
    if (leg || plain) {
      if (!legacyOk) return { ok:false, msg:'이름 또는 비밀번호가 틀렸어요' };
      if (authOff(signErr)) return legacySession(name, '이메일/비밀번호 로그인이 Firebase에서 꺼져 있어 임시 방식으로 로그인했어요. 안내서 2단계를 진행해 주세요.');
      let newPw = pw;
      if (pw.length < 6) {
        newPw = prompt('보안 로그인으로 옮기는 중입니다.\n6자 이상의 새 비밀번호를 정해 주세요. (다음부터 이 비밀번호를 씁니다)') || '';
        if (newPw.length < 6) return legacySession(name, '새 비밀번호가 6자 미만이라 이번에는 임시 방식으로 로그인했어요.');
      }
      try {
        const cred = await C.auth.createUserWithEmailAndPassword(email, newPw);
        await addAdminUid(cred.user.uid, name);
        C.legacyAdmin = null; recomputeAdmin();
        return { ok:true, warn: newPw !== pw ? '새 비밀번호로 바뀌었어요. 다음부터 새 비밀번호로 로그인하세요.' : '' };
      } catch (e) {
        if (authOff(e)) return legacySession(name, '이메일/비밀번호 로그인이 꺼져 있어 임시 방식으로 로그인했어요. 안내서 2단계를 진행해 주세요.');
        if (e.code === 'auth/email-already-in-use') return { ok:false, msg:'이미 보안 계정이 있어요. 그 계정의 비밀번호로 로그인하세요.' };
        await backToAnon();
        if (e.code === 'permission-denied') return { ok:false, msg:'보안 규칙이 이미 적용되어 스스로 옮길 수 없어요. 다른 관리자가 [관리자 추가]로 다시 등록해 주세요.' };
        return { ok:false, msg:'로그인 이전 실패: ' + (e.code || e.message) };
      }
    }
    // 3) 관리자가 한 명도 없으면 첫 관리자 만들기
    if (!C.hasAnyAdmin()) {
      if (pw.length < 6) return { ok:false, msg:'첫 관리자 비밀번호는 6자 이상이어야 해요' };
      try {
        const cred = await C.auth.createUserWithEmailAndPassword(email, pw);
        await addAdminUid(cred.user.uid, name); recomputeAdmin();
        return { ok:true, warn:'첫 관리자가 생성됐어요' };
      } catch (e) {
        if (authOff(e)) {
          const salt = randHex(8);
          await C.db.collection('config').doc('admins').set({ legacy:[{ name, salt, hash:hashPw(salt, pw) }], uids:[], names:{} }, { merge:true });
          return legacySession(name, '이메일/비밀번호 로그인이 꺼져 있어 임시 방식으로 첫 관리자를 만들었어요.');
        }
        return { ok:false, msg:'첫 관리자 생성 실패: ' + (e.code || e.message) };
      }
    }
    return { ok:false, msg:'이름 또는 비밀번호가 틀렸어요' };
  };
  function legacySession(name, warn){ C.legacyAdmin = { name }; recomputeAdmin(); return { ok:true, warn }; }

  C.adminLogout = async () => {
    C.legacyAdmin = null;
    if (C.user && !C.user.isAnonymous) { await backToAnon(); }   // 로그아웃 후 자동으로 익명 접속
    recomputeAdmin();
  };

  // ── 관리자 추가/삭제 (관리자만) ──
  C.registerAdmin = async (name, pw) => {
    name = String(name || '').trim();
    if (!C.isAdmin) throw new Error('관리자만 할 수 있어요');
    if (!name || name.length > 10) throw new Error('이름은 1~10자로 입력하세요');
    if (C.adminList().some(a => a.name === name)) throw new Error('이미 있는 이름이에요');
    if (String(pw).length < 6) throw new Error('비밀번호는 6자 이상이어야 해요');
    const sec = firebase.apps.find(a => a.name === 'adminCreator') || firebase.initializeApp(FIREBASE_CONFIG, 'adminCreator');
    const secAuth = sec.auth();
    try { await secAuth.setPersistence(firebase.auth.Auth.Persistence.NONE); } catch {}
    let uid;
    try {
      uid = (await secAuth.createUserWithEmailAndPassword(adminEmail(name), pw)).user.uid;
    } catch (e) {
      if (e.code === 'auth/email-already-in-use') uid = (await secAuth.signInWithEmailAndPassword(adminEmail(name), pw)).user.uid;
      else if (authOff(e)) {
        const salt = randHex(8);
        await C.db.collection('config').doc('admins').set({ legacy: C.FieldValue.arrayUnion({ name, salt, hash:hashPw(salt, pw) }) }, { merge:true });
        try { await secAuth.signOut(); } catch {}
        return '이메일/비밀번호 로그인이 꺼져 있어 임시 방식으로 추가했어요';
      } else throw e;
    }
    try { await secAuth.signOut(); } catch {}
    await addAdminUid(uid, name);
    return '';
  };
  C.deleteAdmin = async id => {
    if (!C.isAdmin) throw new Error('관리자만 할 수 있어요');
    const ref = C.db.collection('config').doc('admins');
    await C.db.runTransaction(async tx => {
      const s = await tx.get(ref); const d = s.exists ? s.data() : {};
      let uids = Array.isArray(d.uids) ? d.uids : [], names = { ...(d.names || {}) }, legacy = Array.isArray(d.legacy) ? d.legacy : [];
      if (id.startsWith('legacy:')) legacy = legacy.filter(l => l.name !== id.slice(7));
      else { uids = uids.filter(u => u !== id); delete names[id]; }
      tx.set(ref, { uids, names, legacy });
    });
  };
  C.isMe = id => C.user && id === C.user.uid || (C.legacyAdmin && id === 'legacy:' + C.legacyAdmin.name);

  // ── 공유 명단 수정 (관리자만, 동시 수정에 안전하도록 트랜잭션 사용) ──
  C.updateRoster = async mutate => {
    if (!C.isAdmin) throw new Error('명단 수정은 관리자만 할 수 있어요');
    const ref = C.db.collection('config').doc('roster');
    await C.db.runTransaction(async tx => {
      const s = await tx.get(ref); const d = s.exists ? s.data() : {};
      const members = (Array.isArray(d.members) ? d.members : []).map(m => ({ ...m }));
      const couples = (Array.isArray(d.couples) ? d.couples : []).map(c => ({ ...c }));
      const r = mutate(members, couples);
      if (r === false) return;
      tx.set(ref, { members, couples, updatedAt: Date.now() });
    });
  };
  C.setGender = (name, gender) => C.updateRoster(ms => { const m = ms.find(x => x.name === name); if (!m) return false; m.gender = gender; });
  C.setCar = (name, car) => C.updateRoster(ms => { const m = ms.find(x => x.name === name); if (!m) return false; m.car = !!car; });
  C.addMember = (name, gender) => C.updateRoster(ms => { if (ms.some(x => x.name === name)) throw new Error('이미 등록된 이름이에요'); ms.push({ name, gender, group:'', role:'', car:false }); });
  C.removeMember = name => C.updateRoster((ms, cs) => {
    const i = ms.findIndex(x => x.name === name); if (i < 0) return false; ms.splice(i, 1);
    for (let j = cs.length - 1; j >= 0; j--) if (cs[j].a === name || cs[j].b === name) cs.splice(j, 1);
  });
  // 명단 JSON 가져오기: 예전 cars / genderOverrides 자료가 있으면 함께 반영
  C.importRoster = async json => {
    if (!C.isAdmin) throw new Error('관리자만 할 수 있어요');
    const src = Array.isArray(json) ? { members: json } : json;
    if (!src || !Array.isArray(src.members) || !src.members.length) throw new Error('members 목록이 없는 파일이에요');
    const members = src.members.filter(m => m && m.name).map(m => ({ name:String(m.name).trim(), gender:['M','F'].includes(m.gender) ? m.gender : 'U', group:m.group || '', role:m.role || '', car:!!m.car }));
    const couples = (Array.isArray(src.couples) ? src.couples : []).map(c => Array.isArray(c) ? { a:c[0], b:c[1] } : c).filter(c => c && c.a && c.b);
    const notes = [];
    if (src.mergeOldCloudData !== false) {
      try {
        const [carsSnap, ovSnap] = await Promise.all([C.db.collection('config').doc('cars').get(), C.db.collection('config').doc('genderOverrides').get()]);
        const cars = carsSnap.exists ? (carsSnap.data().list || []) : [];
        if (cars.length) { members.forEach(m => { m.car = cars.includes(m.name); }); notes.push('예전 차량 목록 ' + cars.length + '명 반영'); }
        const ov = ovSnap.exists ? (ovSnap.data().overrides || {}) : {};
        let changed = 0, added = 0;
        Object.entries(ov).forEach(([name, g]) => {
          if (!['M','F'].includes(g)) return;
          const m = members.find(x => x.name === name);
          if (m) { if (m.gender !== g) { m.gender = g; changed++; } }
          else { members.push({ name, gender:g, group:'', role:'', car:cars.includes(name) }); added++; }
        });
        if (changed || added) notes.push('예전 성별 수정 ' + changed + '건, 추가 이름 ' + added + '명 반영');
      } catch (e) { notes.push('예전 차량/성별 자료는 읽지 못했어요(' + (e.code || e.message) + ')'); }
    }
    const seen = new Set(); const uniq = members.filter(m => !seen.has(m.name) && seen.add(m.name));
    await C.db.collection('config').doc('roster').set({ members:uniq, couples, updatedAt:Date.now() });
    return { count: uniq.length, notes };
  };

  // ── 예약 ──
  C.addReservation = (dateKey, name) => C.db.collection('reservations').add({
    dateKey, time:'오전', name, createdAt:Date.now(), deviceId:C.deviceId, ownerUid:(C.user && C.user.uid) || ''
  });
  C.canCancel = r => C.isAdmin || (C.user && r.ownerUid && r.ownerUid === C.user.uid) || (!!r.deviceId && r.deviceId === C.deviceId);

  // ── 설정(인도자) 저장: 필드 단위로 바꿔 다른 값을 덮지 않음 ──
  C.saveLeaders = async (leaders, weeklyLeaders) => {
    const ref = C.db.collection('config').doc('settings');
    try { await ref.update({ leaders, weeklyLeaders }); }
    catch (e) { if (e.code === 'not-found') await ref.set({ leaders, weeklyLeaders }, { merge:true }); else throw e; }
  };

  // ── 지난 자료 정리: 관리자 접속 시 하루 한 번만 ──
  C.runDailyCleanup = async () => {
    if (!C.isAdmin || !C.db || C._cleaning) return;
    const today = C.todayKey();
    if (C.settings.lastCleanup === today) return;
    C._cleaning = true;
    try {
      const refs = [];
      (await C.db.collection('reservations').where('dateKey', '<', today).get()).docs.forEach(d => refs.push(d.ref));
      for (const [col, keepDays] of [['pairs',0],['groups',0],['attendance',90],['display',180]]) {
        const limit = C.addDays(today, -keepDays);
        (await C.db.collection(col).get()).docs.forEach(d => { if (C.isDateKey(d.id) && d.id < limit) refs.push(d.ref); });
      }
      for (let i = 0; i < refs.length; i += 400) { const b = C.db.batch(); refs.slice(i, i + 400).forEach(r => b.delete(r)); await b.commit(); }
      await C.db.collection('config').doc('settings').set({ lastCleanup: today }, { merge:true });
      if (refs.length) console.info('지난 자료 ' + refs.length + '건 정리');
    } catch (e) { console.warn('지난 자료 정리 실패:', e.code || e.message); }
    finally { C._cleaning = false; }
  };
  C.on('admin', isAdmin => { if (isAdmin) C.runDailyCleanup(); });
  C.on('settings', () => { if (C.isAdmin) C.runDailyCleanup(); });

  // ── 통합 백업 / 복원 (관리자만) ──
  const BACKUP_COLLECTIONS = ['reservations','attendance','pairs','display'];
  C.makeBackup = async () => {
    if (!C.isAdmin) throw new Error('백업은 관리자로 로그인한 뒤 할 수 있어요');
    const collections = {};
    for (const name of BACKUP_COLLECTIONS) collections[name] = (await C.db.collection(name).get()).docs.map(d => ({ id:d.id, data:d.data() }));
    const cfg = {};
    for (const id of ['settings','roster']) { const s = await C.db.collection('config').doc(id).get(); if (s.exists) { const d = { ...s.data() }; delete d.admins; cfg[id] = d; } }
    return { format:'gyeongju-dongbu-unified', version:3, exportedAt:new Date().toISOString(), collections, config:cfg };
  };
  C.restoreBackup = async payload => {
    if (!C.isAdmin) throw new Error('복원은 관리자로 로그인한 뒤 할 수 있어요');
    if (!payload || payload.format !== 'gyeongju-dongbu-unified') throw new Error('통합 백업 파일 형식이 아니에요');
    let collections = {}, cfg = {};
    if (payload.version >= 3) { collections = payload.collections || {}; cfg = payload.config || {}; }
    else {   // 예전(버전 2) 백업 파일
      const old = payload.collections || {};
      ['reservations','attendance','pairs'].forEach(n => { collections[n] = old[n] || []; });
      const st = (old.config || []).find(x => x.id === 'settings');
      if (st && st.data) { const d = { ...st.data }; delete d.admins; cfg.settings = d; }
      const hist = (payload.displayState && payload.displayState.history) || {};
      collections.display = Object.entries(hist).filter(([k, v]) => C.isDateKey(k) && Array.isArray(v))
        .map(([k, teams]) => ({ id:k, data:{ checked:[], removed:[], teams:teams.map(t => ({ members:(t || []).map(x => typeof x === 'string' ? x : x && x.name).filter(Boolean) })), updatedAt:Date.now() } }));
    }
    for (const name of BACKUP_COLLECTIONS) {
      const incoming = (Array.isArray(collections[name]) ? collections[name] : []).filter(x => x && typeof x.id === 'string' && x.id && !x.id.includes('/') && x.data && typeof x.data === 'object');
      const keep = new Set(incoming.map(x => x.id));
      const snap = await C.db.collection(name).get();
      const ops = [...snap.docs.filter(d => !keep.has(d.id)).map(d => ({ ref:d.ref })), ...incoming.map(x => ({ ref:C.db.collection(name).doc(x.id), data:x.data }))];
      for (let i = 0; i < ops.length; i += 400) { const b = C.db.batch(); ops.slice(i, i + 400).forEach(o => o.data ? b.set(o.ref, o.data) : b.delete(o.ref)); await b.commit(); }
    }
    for (const id of ['settings','roster']) if (cfg[id] && typeof cfg[id] === 'object') { const d = { ...cfg[id] }; delete d.admins; await C.db.collection('config').doc(id).set(d); }
  };
  return C;
})();
window.Core = Core;

/* =====================================================================
   통합 화면(틀)
   ===================================================================== */
function readTemplate(id){
  return document.getElementById(id).textContent.replace(/<\\\/script/gi, '</script').replace(/<\\!--/g, '<!--');
}
const frames = { outdoor: document.getElementById('outdoorFrame'), display: document.getElementById('displayFrame') };
const portalStatus = document.getElementById('portalStatus');
function setPortalStatus(text, kind){
  portalStatus.textContent = '● ' + text;
  portalStatus.style.color = kind === 'err' ? '#ffd0d0' : kind === 'ok' ? '#d9f6df' : kind === 'warn' ? '#ffe8b3' : '#e7f1fa';
}
Core.on('status', setPortalStatus);
Core.on('admin', (isAdmin, name) => setPortalStatus(isAdmin ? name + ' 관리자 로그인됨' : '관리자 로그아웃됨', isAdmin ? 'ok' : 'info'));

function switchModule(name){
  Object.entries(frames).forEach(([key, f]) => f.classList.toggle('active', key === name));
  document.querySelectorAll('.portal-tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.module === name)));
  try { localStorage.setItem('portalTab', name); } catch {}
  try { frames[name].contentWindow.dispatchEvent(new Event('resize')); } catch {}
}
document.querySelectorAll('.portal-tab').forEach(b => b.addEventListener('click', () => switchModule(b.dataset.module)));

// 글자 크기
const fontSelect = document.getElementById('portalFontSize');
function applyZoom(){
  const zoom = Number(fontSelect.value) || 1;
  Object.values(frames).forEach(f => { try { f.contentDocument.body.style.zoom = String(zoom); } catch {} });
}
fontSelect.value = (() => { try { return localStorage.getItem('portalFontZoom') || '1'; } catch { return '1'; } })();
fontSelect.addEventListener('change', () => { try { localStorage.setItem('portalFontZoom', fontSelect.value); } catch {} applyZoom(); setPortalStatus('글자 크기 적용됨', 'ok'); });
Object.values(frames).forEach(f => f.addEventListener('load', applyZoom));

// 백업 / 복원 (버튼 분리)
document.getElementById('portalBackup').addEventListener('click', async () => {
  try {
    setPortalStatus('백업 자료를 모으는 중…');
    const payload = await Core.makeBackup();
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob); const a = document.createElement('a');
    a.href = url; a.download = '경주동부_통합봉사관리_백업_' + Core.todayKey() + '.json'; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
    setPortalStatus('통합 백업 파일 내려받기 완료', 'ok');
  } catch (e) { setPortalStatus('백업 실패: ' + e.message, 'err'); alert(e.message); }
});
document.getElementById('portalRestore').addEventListener('click', () => {
  if (!Core.isAdmin) { alert('복원은 관리자로 로그인한 뒤 할 수 있어요.\n(야외 봉사 화면 오른쪽 위 🔐 관리자)'); return; }
  document.getElementById('portalRestoreFile').click();
});
document.getElementById('portalRestoreFile').addEventListener('change', async e => {
  const file = e.target.files && e.target.files[0]; e.target.value = ''; if (!file) return;
  try {
    const payload = JSON.parse(await file.text());
    if (payload.format !== 'gyeongju-dongbu-unified') throw new Error('통합 백업 파일 형식이 아니에요');
    if (!confirm('백업 파일(' + (payload.exportedAt ? new Date(payload.exportedAt).toLocaleString('ko-KR') : '날짜 모름') + ')의 자료로 현재 자료를 바꿉니다.\n먼저 [💾 백업]으로 현재 자료를 받아 두셨나요?\n\n복원할까요?')) return;
    setPortalStatus('복원 중… 화면을 닫지 마세요');
    await Core.restoreBackup(payload);
    setPortalStatus('복원 완료', 'ok'); alert('복원이 완료되었습니다.');
  } catch (err) { setPortalStatus('복원 실패: ' + err.message, 'err'); alert('복원 실패: ' + err.message); }
});

// 홈 화면 추가 (PWA)
(() => {
  let deferred = null;
  const banner = document.getElementById('pwaBanner');
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault(); deferred = e;
    try { if (!standalone && !localStorage.getItem('pwaBannerDismissed')) banner.classList.add('show'); } catch {}
  });
  document.getElementById('pwaInstall').addEventListener('click', async () => {
    if (!deferred) { alert('브라우저 메뉴 → "홈 화면에 추가"를 눌러 주세요.\n(아이폰: 공유 버튼 → 홈 화면에 추가)'); return; }
    deferred.prompt(); await deferred.userChoice; deferred = null; banner.classList.remove('show');
  });
  document.getElementById('pwaClose').addEventListener('click', () => { banner.classList.remove('show'); try { localStorage.setItem('pwaBannerDismissed', '1'); } catch {} });
  window.addEventListener('appinstalled', () => banner.classList.remove('show'));
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(err => console.warn('서비스 워커 등록 실패', err));
})();

// 시작: Core 먼저, 그다음 두 화면을 띄움
Core.init();
frames.outdoor.srcdoc = readTemplate('tpl-outdoor');
frames.display.srcdoc = readTemplate('tpl-display');
switchModule((() => { try { return localStorage.getItem('portalTab') || 'outdoor'; } catch { return 'outdoor'; } })());
</script>
</body>
</html>
