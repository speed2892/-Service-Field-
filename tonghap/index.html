<style>
:root{--navy:#173f68;--blue:#24639a;--gold:#f2c45c;--bg:#eef2f6;--ink:#172534;--muted:#657587}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"Noto Sans KR","Pretendard",system-ui,-apple-system,"Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
.portal-head{flex:0 0 auto;background:linear-gradient(120deg,#173f68,#245f91);color:#fff;box-shadow:0 3px 14px #102b472b;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 0;z-index:10}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;max-width:1500px;margin:auto;padding:0 2px 8px}
.portal-title{font-size:18px;font-weight:900;letter-spacing:-.02em}
.portal-sub{font-size:11px;opacity:.8;margin-top:1px}
.head-tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.head-tools select,.head-tools button{border:1px solid #ffffff70;border-radius:8px;padding:6px 9px;min-height:34px;font:inherit;font-size:12px;font-weight:700}
.head-tools select{background:#fff;color:#173f68}
.head-tools button{background:#ffffff20;color:#fff;cursor:pointer}
.head-tools button:focus-visible,.head-tools select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.portal-nav{display:flex;gap:6px;max-width:1500px;margin:auto}
.portal-tab{flex:1;min-height:44px;border:0;border-radius:10px 10px 0 0;background:#ffffff20;color:#e8f1f8;padding:10px;font:inherit;font-size:14px;font-weight:800;cursor:pointer;white-space:nowrap;letter-spacing:-.02em}
.portal-tab[aria-selected="true"]{background:#fff;color:var(--navy);box-shadow:inset 0 -3px var(--gold)}
.portal-tab:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#portalStatus{max-width:1500px;margin:0 auto;padding:4px 2px 6px;font-size:11px;color:#e7f1fa}
.module-wrap{flex:1 1 auto;min-height:0;position:relative}
.module-frame{display:none;position:absolute;inset:0;width:100%;height:100%;border:0;background:#f5f7f9}
.module-frame.active{display:block}
.pwa-banner{display:none;align-items:center;gap:10px;padding:8px 12px;background:#0f2f50;color:#fff;font-size:13px}
.pwa-banner.show{display:flex}
.pwa-banner span{flex:1}
.pwa-banner button{border:0;border-radius:16px;padding:6px 12px;font:inherit;font-weight:700;cursor:pointer}
.pwa-banner .x{background:none;color:#fff;font-size:18px;padding:0 4px}
@media(max-width:600px){.portal-title{font-size:15px}.portal-sub{display:none}.portal-tab{font-size:13px;padding:9px 6px}.head-tools button,.head-tools select{padding:5px 7px;font-size:11px}}
</style>
</head>
<body>
<div class="pwa-banner" id="pwaBanner"><span>📲 홈 화면에 추가하면 앱처럼 열 수 있어요</span><button id="pwaInstall" type="button">추가</button><button class="x" id="pwaClose" type="button" aria-label="닫기">✕</button></div>
<header class="portal-head">
 <div class="row">
  <div><div class="portal-title">⛺ 경주 동부 회중 통합 봉사 관리</div><div class="portal-sub">야외 봉사 일정 · 전시대 팀 배정</div></div>
  <div class="head-tools">
   <select id="portalFontSize" aria-label="글자 크기"><option value="1">글자 보통</option><option value="1.08">글자 크게</option><option value="1.16">글자 아주 크게</option></select>
   <button id="portalBackup" type="button">💾 백업</button>
   <button id="portalRestore" type="button">📂 복원</button>
  </div>
 </div>
 <nav class="portal-nav" aria-label="기능 선택">
  <button class="portal-tab" type="button" data-module="outdoor" aria-selected="true">📅 야외 봉사 일정</button>
  <button class="portal-tab" type="button" data-module="display" aria-selected="false">🚩 전시대 팀 배정</button>
 </nav>
 <div id="portalStatus" role="status">● 연결 중…</div>
</header>
<main class="module-wrap">
 <iframe id="outdoorFrame" class="module-frame active" title="야외 봉사 일정"></iframe>
 <iframe id="displayFrame" class="module-frame" title="전시대 팀 배정"></iframe>
</main>
<input id="portalRestoreFile" type="file" accept="application/json,.json" hidden>

<!-- 두 화면의 원본 HTML. 고칠 때는 이 부분을 직접 고치면 됩니다.
     (규칙: 안의 "</script" 는 "<\/script" 로, "<!--" 는 "<\!--" 로 적습니다) -->
<script type="text/plain" id="tpl-outdoor"><!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>야외 봉사 일정표</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#f0ede8; --surface:#fff; --surface2:#f7f5f2; --border:#e0d8ce;
  --text:#1c1a17; --text2:#5a5248; --text3:#9a9088;
  --blue:#1a4a7a; --blue2:#2e6fad; --blue-bg:#eaf2fc;
  --green:#2e6e3a; --green2:#3a9048; --green-bg:#e6f4ea;
  --orange:#c87828; --orange-bg:#fef3e0;
  --red:#c03030; --red-bg:#fdeaea;
  --gold:#a07820; --radius:14px;
  --shadow:0 2px 16px rgba(0,0,0,.1);
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh}
.app-hdr{background:var(--blue);color:#fff;padding:calc(10px + var(--safe-top)) 16px 0;position:sticky;top:0;z-index:200;box-shadow:0 2px 18px rgba(0,0,0,.25)}
.hdr-inner{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.hdr-title{font-family:'Noto Serif KR',serif;font-size:15px;font-weight:700}
.hdr-title small{display:block;font-size:10px;font-weight:400;opacity:.6;font-family:'Noto Sans KR',sans-serif}
.hdr-btns{display:flex;gap:6px;align-items:center}
.hdr-btn{padding:5px 12px;border-radius:50px;border:1.5px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);color:#fff;font-size:11px;font-family:inherit;cursor:pointer;font-weight:500;white-space:nowrap}
.hdr-btn.danger{background:rgba(200,50,50,.3);border-color:rgba(255,150,150,.5)}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 16px;font-size:12px;font-weight:500;color:rgba(255,255,255,.5);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;font-family:inherit;background:none;border-top:none;border-left:none;border-right:none;flex-shrink:0}
.tab.on{color:#fff;border-bottom-color:#ffd54f}
.page{display:none;animation:fadeUp .2s ease both}
.page.on{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.cal-wrap{padding:12px}
.month-nav{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:var(--radius);padding:10px 16px;margin-bottom:10px;box-shadow:var(--shadow)}
.month-nav-btn{background:none;border:1.5px solid var(--border);border-radius:7px;padding:5px 13px;font-size:16px;cursor:pointer;color:var(--text2)}
.month-nav-btn:active{background:var(--blue-bg)}
.month-title{font-family:'Noto Serif KR',serif;font-size:17px;font-weight:700;color:var(--blue)}
.dow-row{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:3px;padding:0 1px}
.dow-cell{text-align:center;font-size:10px;font-weight:700;color:var(--text3);padding:3px 0}
.dow-cell:first-child{color:#c03030}
.dow-cell:last-child{color:#1a4a7a}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-day{background:#fff;border:1.5px solid var(--border);border-radius:9px;padding:5px 3px 4px;cursor:pointer;transition:all .15s;min-height:64px;display:flex;flex-direction:column;align-items:center;overflow:hidden}
.cal-day:active{transform:scale(.95)}
.cal-day.today{border-color:var(--green2);background:var(--green-bg)}
.cal-day.today .cal-num{color:var(--green);font-weight:700}
.cal-day.has-res{border-color:var(--blue2);border-width:2px}
.cal-day.has-leader{box-shadow:0 0 0 2px var(--orange) inset}
.cal-day.past{opacity:.4;background:#f5f3f0}
.cal-day.past .cal-num{color:var(--text3)}
.cal-day.sun .cal-num{color:#c03030}
.cal-day.sat .cal-num{color:#1a6090}
.cal-day.empty{background:transparent;border-color:transparent;cursor:default;pointer-events:none}
.cal-num{font-size:13px;font-weight:600;line-height:1}
.cal-leader{margin-top:2px;width:100%;text-align:center}
.cal-leader-name{display:block;font-size:8px;color:var(--blue);font-weight:700;background:var(--blue-bg);border-radius:3px;padding:1px 3px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-dots{display:flex;gap:2px;margin-top:3px;flex-wrap:wrap;justify-content:center}
.cal-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.cal-dot.am{background:var(--green2)}
.cal-dot.pm{background:var(--orange)}
.stats{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;scrollbar-width:none}
.stats::-webkit-scrollbar{display:none}
.stat{background:#fff;border-radius:9px;padding:8px 12px;display:flex;flex-direction:column;align-items:center;flex-shrink:0;box-shadow:var(--shadow);border:1px solid var(--border);min-width:68px}
.stat-n{font-size:18px;font-weight:700;color:var(--blue)}
.stat-l{font-size:10px;color:var(--text3);margin-top:1px}
.list-wrap{padding:12px}
.section-card{background:#fff;border-radius:var(--radius);padding:14px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.section-title{font-family:'Noto Serif KR',serif;font-size:14px;font-weight:700;color:var(--blue);margin-bottom:10px}
.reserve-item{display:flex;align-items:center;gap:7px;padding:7px 9px;border-radius:8px;background:var(--surface2);margin-bottom:5px;border:1px solid var(--border)}
.ri-date{font-size:12px;font-weight:700;color:var(--blue);min-width:34px}
.ri-time{font-size:11px;padding:2px 7px;border-radius:20px;font-weight:600}
.ri-time.am{background:var(--green-bg);color:var(--green)}
.ri-time.pm{background:var(--orange-bg);color:var(--orange)}
.ri-name{flex:1;font-size:13px;font-weight:500}
.ri-del{background:none;border:none;color:var(--text3);font-size:15px;cursor:pointer;padding:2px 4px;border-radius:4px}
.ri-del:active{background:var(--red-bg);color:var(--red)}
.empty-msg{text-align:center;color:var(--text3);font-size:13px;padding:20px}
.assign-card{background:#fff;border-radius:var(--radius);margin-bottom:8px;box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--border)}
.assign-hdr{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:10px 13px;border-bottom:1px solid var(--border);background:#f0f7ff}
.assign-date{font-family:'Noto Serif KR',serif;font-size:15px;font-weight:700;color:var(--blue)}
.assign-date.sun{color:#c03030}
.assign-date.sat{color:#1a6090}
.assign-leader-tag{background:var(--orange-bg);color:var(--orange);border-radius:50px;padding:2px 10px;font-size:11px;font-weight:700}
.assign-cnt{margin-left:auto;background:var(--blue-bg);color:var(--blue);border-radius:50px;padding:2px 9px;font-size:11px;font-weight:700}
.assign-body{padding:10px 13px 12px}
.assign-slbl{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.5px;margin:8px 0 5px}
.assign-slbl:first-child{margin-top:0}
.assign-names{display:flex;flex-wrap:wrap;gap:5px}
.assign-tag{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:3px 9px;font-size:12px;font-weight:500}
.assign-tag.am{border-left:3px solid var(--green2)}
.assign-tag.pm{border-left:3px solid var(--orange)}
.assign-empty{color:var(--text3);font-size:12px}
.admin-wrap{padding:12px}
.card{background:#fff;border-radius:var(--radius);padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.card-title{font-family:'Noto Serif KR',serif;font-size:14px;font-weight:700;color:var(--blue);margin-bottom:11px}
.form-row{display:flex;gap:7px;margin-bottom:7px;flex-wrap:wrap}
.fi{flex:1;min-width:90px;padding:8px 11px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:13px;background:var(--surface2);outline:none;color:var(--text)}
.fi:focus{border-color:var(--blue2)}
.fi-sm{max-width:85px}
.btn{padding:8px 14px;border-radius:8px;border:none;font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn-blue{background:var(--blue);color:#fff}
.btn-green{background:var(--green);color:#fff}
.btn-red{background:var(--red-bg);color:var(--red);border:1px solid #f0c0c0}
.btn-gray{background:#eee;color:var(--text2)}
.leader-item{display:flex;align-items:center;gap:7px;padding:6px 9px;border-radius:8px;background:var(--surface2);border:1px solid var(--border);margin-bottom:5px}
.li-date{font-size:12px;font-weight:700;color:var(--blue);min-width:38px}
.li-name{flex:1;font-size:13px;font-weight:500}
.li-del{background:none;border:none;color:var(--text3);font-size:15px;cursor:pointer;padding:2px 4px}
.badge{display:inline-block;border-radius:20px;padding:2px 8px;font-size:10px;font-weight:600}
.badge-green{background:var(--green-bg);color:var(--green)}
.badge-orange{background:var(--orange-bg);color:var(--orange)}
.badge-blue{background:var(--blue-bg);color:var(--blue)}
/* ── 차량조 배정 ── */

/* ── 성원 탭 ── */
.members-wrap{padding:12px}
.members-search{display:flex;gap:6px;margin-bottom:10px}
.members-search input{flex:1;padding:9px 13px;border:1.5px solid var(--border);border-radius:9px;font-family:inherit;font-size:14px;outline:none;background:#fff}
.members-search input:focus{border-color:var(--blue2)}
.members-gender-tabs{display:flex;gap:6px;margin-bottom:10px}
.mg-btn{padding:6px 16px;border-radius:20px;border:1.5px solid var(--border);background:#fff;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;color:var(--text2)}
.mg-btn.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.mg-btn.M{} .mg-btn.F{}
.member-card{display:flex;align-items:center;gap:10px;padding:10px 13px;background:#fff;border-radius:10px;margin-bottom:6px;border:1px solid var(--border);box-shadow:var(--shadow)}
.member-card.M{border-left:3px solid #1565c0}
.member-card.F{border-left:3px solid #ad1457}
.member-gender-badge{font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;flex-shrink:0}
.member-gender-badge.M{background:#e3f2fd;color:#1565c0}
.member-gender-badge.F{background:#fce4ec;color:#ad1457}
.member-name{flex:1;font-size:14px;font-weight:500;color:var(--text)}
.member-car-toggle{display:flex;align-items:center;gap:5px;cursor:pointer;user-select:none}
.member-car-toggle input[type=checkbox]{width:18px;height:18px;cursor:pointer;accent-color:#1565c0}
.member-car-lbl{font-size:12px;color:var(--text2)}
.member-car-on .member-car-lbl{color:#1565c0;font-weight:700}
.members-cnt{font-size:11px;color:var(--text3);margin-left:4px}

/* ── 차량조 결과 카드 ── */

.pair-wrap{padding:12px}
.pair-date-card{background:#fff;border-radius:var(--radius);margin-bottom:10px;box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--border)}
.pair-date-hdr{display:flex;align-items:center;gap:8px;padding:10px 13px;background:linear-gradient(135deg,#eaf2fc,#f0f7ff);border-bottom:1px solid var(--border)}
.pair-date-title{font-family:'Noto Serif KR',serif;font-size:15px;font-weight:700;color:var(--blue)}
.pair-date-title.sun{color:#c03030}
.pair-date-title.sat{color:#1a6090}
.pair-date-cnt{margin-left:auto;background:var(--blue-bg);color:var(--blue);border-radius:50px;padding:2px 9px;font-size:11px;font-weight:700}
.pair-body{padding:10px 13px 13px}
.pair-time-section{margin-bottom:10px}
.pair-time-section:last-child{margin-bottom:0}
.pair-time-lbl{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.5px;margin-bottom:6px}
.pair-list{display:flex;flex-direction:column;gap:5px}
.pair-row{display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:9px;border:1.5px solid var(--border);background:var(--surface2);flex-wrap:nowrap}
.pair-row.paired{background:#f0faf3;border-color:#81c995}
.pair-row.unpaired{background:#fff8f0;border-color:#ffcc80}
.pair-num{font-size:11px;font-weight:700;color:var(--text3);min-width:18px;flex-shrink:0}
.pair-heart{font-size:13px;flex-shrink:0}
.pair-names{flex:1;font-size:13px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pair-names .pair-b{color:var(--text3);font-size:11px;margin:0 2px}
.pair-solo-name{flex:1;font-size:13px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pair-solo-badge{font-size:10px;background:#fff3e0;color:#e65100;border-radius:20px;padding:1px 7px;font-weight:600;flex-shrink:0}
.pair-card-input{width:64px;padding:3px 6px;border:1.5px solid var(--border);border-radius:6px;font-family:inherit;font-size:12px;font-weight:700;color:var(--text);background:#fff;outline:none;text-align:center}
.pair-card-input:focus{border-color:var(--gold)}
.pair-card-save{padding:3px 9px;background:var(--gold);color:#fff;border:none;border-radius:6px;font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap}
.pair-card-save:active{opacity:.8}
.pair-card-badge{display:inline-flex;align-items:center;gap:3px;background:#fff8e0;border:1.5px solid #f5d97a;border-radius:7px;padding:2px 8px;font-size:11px;font-weight:700;color:#7a5800;white-space:nowrap;flex-shrink:0}
.pair-admin-section{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border)}
.pair-admin-lbl{font-size:10px;font-weight:700;color:var(--text3);margin-bottom:6px;letter-spacing:.5px}
.pair-select-row{display:flex;gap:5px;align-items:center;margin-bottom:5px;flex-wrap:wrap}
.pair-select-row select{flex:1;min-width:80px;padding:7px 9px;border:1.5px solid var(--border);border-radius:7px;font-family:inherit;font-size:12px;background:var(--surface2);outline:none;color:var(--text)}
.pair-select-row select:focus{border-color:var(--blue2)}
.pair-plus{font-size:15px;color:var(--text3);flex-shrink:0}
.pair-add-btn{padding:7px 13px;background:var(--green);color:#fff;border:none;border-radius:7px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.pair-add-btn:active{background:var(--green2)}
.pair-del-btn{background:none;border:none;color:var(--text3);font-size:14px;cursor:pointer;padding:2px 4px;border-radius:4px;flex-shrink:0}
.pair-del-btn:active{background:var(--red-bg);color:var(--red)}
.pair-empty{color:var(--text3);font-size:12px;text-align:center;padding:12px}
.pair-filter-row{display:flex;gap:5px;margin-bottom:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.pair-filter-row::-webkit-scrollbar{display:none}
.pair-filter-btn{padding:5px 13px;border-radius:50px;border:1.5px solid var(--border);background:#fff;font-family:inherit;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;color:var(--text2);flex-shrink:0}
.pair-filter-btn.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(20,30,50,.5);z-index:500;align-items:flex-end;justify-content:center}
.modal-bg.on{display:flex}
.modal{background:#fff;border-radius:20px 20px 0 0;padding:20px 16px calc(26px + var(--safe-bot));width:100%;max-width:480px;max-height:88dvh;overflow-y:auto;animation:slideUp .22s cubic-bezier(.4,0,.2,1)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.m-handle{width:34px;height:4px;background:#ddd;border-radius:2px;margin:0 auto 14px}
.m-title{font-family:'Noto Serif KR',serif;font-size:16px;font-weight:700;color:var(--blue);margin-bottom:4px}
.m-subtitle{font-size:12px;color:var(--text3);margin-bottom:12px}
.m-leader-box{background:var(--blue-bg);border-radius:8px;padding:8px 11px;margin-bottom:11px;font-size:13px;color:var(--blue2);font-weight:500}
.time-btns{display:flex;gap:7px;margin:8px 0 12px}
.time-btn{flex:1;padding:11px;border-radius:10px;border:2px solid var(--border);background:var(--surface2);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all .12s}
.time-btn.sel-am{border-color:var(--green2);background:var(--green-bg);color:var(--green)}
.time-btn.sel-pm{border-color:var(--orange);background:var(--orange-bg);color:var(--orange)}
.m-acts{display:flex;gap:7px;margin-top:12px}
.m-cancel{padding:11px 14px;background:#eee;color:var(--text2);border:none;border-radius:8px;font-family:inherit;font-size:13px;cursor:pointer}
.m-save{flex:1;padding:11px;background:var(--blue);color:#fff;border:none;border-radius:8px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
.m-save:active{background:var(--blue2)}
.m-save:disabled{opacity:.5;cursor:default}
.modal-reserves{margin-top:12px;border-top:1px solid var(--border);padding-top:10px}
.modal-reserves-title{font-size:11px;font-weight:700;color:var(--text3);margin-bottom:7px;letter-spacing:.5px}
.pw-row{position:relative}
.pw-toggle{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text3);font-size:14px}
.toast{position:fixed;bottom:calc(18px + var(--safe-bot));left:50%;transform:translateX(-50%) translateY(10px);background:#1c1a17;color:#fff;padding:9px 18px;border-radius:50px;font-size:13px;z-index:600;pointer-events:none;opacity:0;transition:.2s;white-space:nowrap;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.loading-overlay{position:fixed;inset:0;background:rgba(240,237,232,.85);z-index:400;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px}
.loading-overlay.on{display:flex}
.loading-spinner{width:36px;height:36px;border:4px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-txt{font-size:13px;color:var(--text2)}
/* ── 홈화면 추가 배너 ── */

@media(min-width:700px){
  .cal-grid{gap:5px}
  .cal-day{min-height:72px;padding:7px 5px}
  .cal-num{font-size:15px}
  .cal-wrap,.list-wrap,.assign-wrap,.admin-wrap,.pair-wrap{max-width:700px;margin:0 auto}
}

/* ── 가독성·접근성 개선: 공통 글꼴 및 조작 영역 ── */
:root { --ui-font: "Noto Sans KR", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
html, body, button, input, select, textarea { font-family: var(--ui-font) !important; }
body { font-size: 15px; line-height: 1.58; letter-spacing: -0.015em; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
h1, h2, h3, h4, .title, .section-title { line-height: 1.35; letter-spacing: -0.025em; }
p, label, li, td, th { line-height: 1.55; }
button, input, select, textarea { font-size: 14px; }
button { min-height: 40px; font-weight: 600; }
input, select, textarea { min-height: 42px; padding-top: 9px; padding-bottom: 9px; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible {
  outline: 3px solid #f0b429 !important; outline-offset: 2px !important;
}
button, a, input, select { -webkit-tap-highlight-color: transparent; }
table { font-size: 14px; }
th { font-weight: 700; }
small, .small, .muted, .hint, .sub { line-height: 1.5; }
@media (max-width: 600px) {
  body { font-size: 15px; }
  button { min-height: 42px; }
  input, select, textarea { font-size: 16px !important; min-height: 44px; }
  th, td { padding-top: 9px; padding-bottom: 9px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
}


/* ── 이번 수정에서 추가한 화면 요소 ── */
.notice-bar{margin:10px 12px 0;padding:10px 12px;border-radius:10px;background:#fff8e0;border:1px solid #f0d58a;color:#6b4f00;font-size:13px;line-height:1.5}
.notice-bar button{margin-left:6px;min-height:32px;padding:4px 10px;border-radius:7px;border:1px solid #c9a227;background:#fff;color:#6b4f00;font-weight:700;cursor:pointer}
.legacy-badge{font-size:10px;color:#a45a00;margin-left:3px}
.cal-leader-name.weekly{opacity:.75}
button.cal-day{font:inherit;color:inherit;width:100%;justify-content:flex-start}
.hint{font-size:11px;color:var(--text3);margin-top:6px;line-height:1.5}
</style>
</head>
<body>
<div id="appBody">

<header class="app-hdr">

  <div class="tabs">

</header>

<div class="notice-bar" id="rosterNotice" style="display:none">

</div>

<div class="page on" id="page-cal">

    </div>
    <div class="dow-row">
      <div class="dow-cell">일</div><div class="dow-cell">월</div><div class="dow-cell">화</div>
      <div class="dow-cell">수</div><div class="dow-cell">목</div><div class="dow-cell">금</div><div class="dow-cell">토</div>

    <div class="cal-grid" id="calGrid"></div>

</div>

<div class="page" id="page-list">
  <div class="list-wrap">
    <div class="section-card">
      <div class="section-title" id="listTitle">📋 이번 달 예약 현황</div>
      <div id="allReserveList"></div>
    </div>
  </div>
</div>

<div class="page" id="page-members">
  <div class="members-wrap">
    <div style="background:#fff;border-radius:10px;padding:10px 12px;margin-bottom:10px;border:1.5px solid #1565c0;box-shadow:var(--shadow)">
      <div style="font-size:11px;font-weight:700;color:#1565c0;margin-bottom:7px">📅 날짜별 참석 체크 (체크하면 바로 저장됩니다)</div>
      <div style="display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap">

        <button class="btn" type="button" id="clearAttendBtn" style="white-space:nowrap;padding:7px 14px;background:var(--surface2)">🗑 이 날 체크 초기화</button>
      </div>

    <div style="display:flex;gap:6px;margin-bottom:10px">
      <input class="fi" id="newMemberName" placeholder="새 이름 입력" maxlength="20" style="flex:1">
      <select id="newMemberGender" style="padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:13px;background:var(--surface2)">
        <option value="M">👨 형제</option>
        <option value="F">👩 자매</option>
      </select>
      <button class="btn btn-green" type="button" id="addMemberBtn" style="white-space:nowrap">추가</button>

    <div class="members-gender-tabs" id="mgTabs">

      <button class="mg-btn" data-mg="U" type="button">❔ 미지정</button>
    </div>
    <div class="members-search">
      <input id="memberSearch" placeholder="🔍 이름 검색">
    </div>
    <div id="memberList"></div>
  </div>
</div>

<div class="page" id="page-pairs">
  <div class="pair-wrap">
    <div id="assignSection" style="margin-bottom:12px;display:none">
      <div style="font-size:11px;font-weight:700;color:var(--text3);letter-spacing:.5px;margin-bottom:6px">📋 인도자 배정 현황</div>
      <div id="assignList"></div>
    </div>
    <div class="pair-filter-row" id="pairFilterRow">
      <button class="pair-filter-btn on" type="button" data-pf="all">전체</button>
      <button class="pair-filter-btn" type="button" data-pf="1">월</button>
      <button class="pair-filter-btn" type="button" data-pf="2">화</button>
      <button class="pair-filter-btn" type="button" data-pf="3">수</button>
      <button class="pair-filter-btn" type="button" data-pf="4">목</button>

      <button class="pair-filter-btn" type="button" data-pf="6">토</button>

    <div id="pairList"></div>
  </div>
</div>

<div class="page" id="page-admin">
  <div class="admin-wrap">
    <div class="card">
      <div class="card-title">📅 요일별 고정 인도자</div>
      <div class="form-row">
        <select class="fi fi-sm" id="wkDay">
          <option value="0">일요일</option><option value="1">월요일</option><option value="2">화요일</option>
          <option value="3">수요일</option><option value="4">목요일</option><option value="5">금요일</option><option value="6">토요일</option>
        </select>
        <select class="fi fi-sm" id="wkTime">
          <option value="오전">오전</option><option value="오후">오후</option><option value="전체">전체</option>
        </select>
        <input class="fi" id="wkLeader" placeholder="인도자 이름" maxlength="20">

      </div>

    </div>

    <div class="card">

        <input class="fi" id="newAdminName" placeholder="이름 (10자 이내)" maxlength="10">
        <input class="fi" id="newAdminPw" type="password" placeholder="비밀번호 (6자 이상)" autocomplete="new-password">
        <button class="btn btn-blue" type="button" id="addAdminBtn">추가</button>

      <div class="hint">"옛 방식" 표시는 아직 보안 로그인으로 옮기지 않은 관리자입니다. 그 관리자가 한 번 로그인하면 자동으로 옮겨집니다.</div>

        <button class="btn btn-green" type="button" id="importRosterBtn">📂 명단 가져오기</button>
        <button class="btn btn-gray" type="button" id="exportRosterBtn">💾 명단 내보내기</button>
        <input type="file" id="rosterFile" accept=".json,application/json" style="display:none">

    <div class="card">
      <div class="card-title">🗂 데이터 관리</div>
      <div class="form-row">

      </div>
      <div class="hint">전체 자료 백업·복원은 맨 위의 [💾 백업] / [📂 복원] 버튼을 쓰세요.</div>

</div>

<div class="modal-bg" id="reserveModal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="m-handle"></div>
    <div class="m-title" id="mTitle"></div>
    <div class="m-subtitle" id="mSubtitle"></div>
    <div class="m-leader-box" id="mLeader"></div>
    <div id="reserveInputArea">
      <div style="font-size:11px;color:var(--text3);margin-bottom:4px">이름</div>
      <input class="fi" id="reserveName" placeholder="이름을 입력하세요" list="rosterNames" maxlength="20" style="width:100%">
      <datalist id="rosterNames"></datalist>

    </div>
    <div class="m-acts">
      <button class="m-cancel" type="button" id="closeReserveBtn">닫기</button>
      <button class="m-save" type="button" id="mSaveBtn">예약하기</button>
    </div>
    <div class="modal-reserves" id="modalReserves"></div>
  </div>
</div>

<div class="modal-bg" id="loginModal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="loginTitle" style="max-width:100%">
    <div class="m-handle"></div>
    <div style="font-size:36px;text-align:center;margin-bottom:8px">🔐</div>
    <div class="m-title" id="loginTitle" style="text-align:center">관리자 로그인</div>
    <div class="m-subtitle" style="text-align:center;margin-bottom:14px">이름과 비밀번호를 입력하세요</div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <input class="fi" id="loginName" placeholder="이름" autocomplete="username" style="width:100%">
      <div class="pw-row">
        <input class="fi" id="loginPw" type="password" placeholder="비밀번호" autocomplete="current-password" style="width:100%;padding-right:38px">
        <button class="pw-toggle" type="button" id="pwToggle" aria-label="비밀번호 보기">👁</button>
      </div>

    <div id="firstAdminBox" style="display:none;margin-top:10px;border-top:1px solid var(--border);padding-top:10px;font-size:12px;color:var(--text3)">
      ⚠️ 등록된 관리자가 없습니다. 입력한 이름과 비밀번호(6자 이상)로 첫 관리자를 만듭니다.
    </div>
    <div class="m-acts" style="margin-top:14px">
      <button class="m-cancel" type="button" id="closeLoginBtn">취소</button>
      <button class="m-save" type="button" id="loginMainBtn">로그인</button>
    </div>

<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-spinner"></div>
  <div class="loading-txt" id="loadingTxt">저장 중...</div>
</div>
<div class="toast" id="toastEl" role="status"></div>

<script>
'use strict';
const Core = window.parent && window.parent.Core;
if (!Core) { document.body.innerHTML = '<p style="padding:20px">이 화면은 통합 앱 안에서 열어야 합니다.</p>'; throw new Error('Core 없음'); }
const $ = id => document.getElementById(id);
const esc = Core.esc;
const DOW_KR = ['일','월','화','수','목','금','토'];

let curYear, curMonth;
{ const t = new Date(); curYear = t.getFullYear(); curMonth = t.getMonth() + 1; }
let selectedKey = null;
let pairFilter = 'all';
let memberGenderFilter = 'all';
let attendance = {};   // dateKey -> [names]
let pairs = {};        // dateKey -> [{a,b,card,carGroup,time}]
let lastToday = Core.todayKey();

// ── 공통 도구 ──
let _tt;
function toast(msg){ const t = $('toastEl'); t.textContent = msg; t.classList.add('on'); clearTimeout(_tt); _tt = setTimeout(() => t.classList.remove('on'), 2600); }
function showLoading(txt){ $('loadingTxt').textContent = txt || '처리 중...'; $('loadingOverlay').classList.add('on'); }
function hideLoading(){ $('loadingOverlay').classList.remove('on'); }
// 저장 작업 공통 처리: 실패해도 로딩 화면이 반드시 닫힘
async function run(label, fn, okMsg){
  showLoading(label);
  try { const value = await fn(); if (okMsg) toast(okMsg); return { value }; }
  catch (e) { console.error(e); toast('❌ ' + friendlyError(e)); return null; }
  finally { hideLoading(); }
}
function friendlyError(e){
  if (e && e.code === 'permission-denied') return '권한이 없어요 (관리자 로그인이 필요할 수 있어요)';
  return (e && (e.message || e.code)) || '알 수 없는 오류';
}
const monthPrefix = () => `${curYear}-${String(curMonth).padStart(2,'0')}`;
const isTabOn = tab => !!document.querySelector(`.tab[data-tab="${tab}"].on`);
function leadersFor(key){
  const dateL = Core.settings.leaders[key] || [];
  if (dateL.length) return { list:dateL, weekly:false };
  const weekL = Core.settings.weeklyLeaders[String(Core.dowOf(key))] || [];
  return key >= Core.todayKey() && weekL.length ? { list:weekL, weekly:true } : { list:[], weekly:false };
}
const timeSuffix = l => l.time && l.time !== '전체' ? ' (' + esc(l.time) + ')' : '';

function renderAll(){
  renderMonth();
  if (isTabOn('list')) renderAllList();
  if (isTabOn('pairs')) { renderAssignView(); renderPairView(); }
  if (isTabOn('members')) renderMemberList();
  if (isTabOn('admin')) renderAdminPage();
  if ($('reserveModal').classList.contains('on') && selectedKey) renderModalReserves();
}

// ── 관리자 로그인 ──
function applyAdminUI(){
  const a = Core.isAdmin;
  $('loginBtn').style.display = a ? 'none' : '';
  $('logoutBtn').style.display = a ? '' : 'none';
  $('logoutBtn').textContent = (Core.adminName || '') + ' 로그아웃';
  $('adminTab').style.display = a ? '' : 'none';
  $('membersTab').style.display = a ? '' : 'none';
  if (!a && (isTabOn('admin') || isTabOn('members'))) switchTab('cal');
  updateRosterNotice();
  renderAll();
}
function showLoginModal(){
  const none = !Core.hasAnyAdmin();
  $('firstAdminBox').style.display = none ? 'block' : 'none';
  $('loginMainBtn').textContent = none ? '첫 관리자 생성' : '로그인';
  $('loginModal').classList.add('on');

function renderMonth(){
  $('monthTitle').textContent = `${curYear}년 ${curMonth}월`;
  updateStats();
  const grid = $('calGrid'); grid.innerHTML = '';
  const firstDay = new Date(curYear, curMonth - 1, 1).getDay();
  const lastDate = new Date(curYear, curMonth, 0).getDate();
  const todayKey = Core.todayKey();
  for (let i = 0; i < firstDay; i++) { const b = document.createElement('div'); b.className = 'cal-day empty'; grid.appendChild(b); }
  for (let d = 1; d <= lastDate; d++) {
    const key = Core.toKey(curYear, curMonth, d), dow = Core.dowOf(key);
    const myRes = Core.reservations.filter(r => r.dateKey === key);
    const L = leadersFor(key);
    const cell = document.createElement('button');
    cell.type = 'button';
    cell.className = 'cal-day';
    cell.setAttribute('aria-label', `${curMonth}월 ${d}일, 예약 ${myRes.length}명`);
    if (key === todayKey) cell.classList.add('today');
    if (key < todayKey) cell.classList.add('past');
    if (myRes.length) cell.classList.add('has-res');
    if (L.list.length) cell.classList.add('has-leader');
    if (dow === 0) cell.classList.add('sun');
    if (dow === 6) cell.classList.add('sat');
    const num = document.createElement('div'); num.className = 'cal-num'; num.textContent = d; cell.appendChild(num);
    if (L.list.length) {
      const lw = document.createElement('div'); lw.className = 'cal-leader';
      L.list.forEach(l => { const sp = document.createElement('span'); sp.className = 'cal-leader-name' + (L.weekly ? ' weekly' : ''); sp.textContent = l.name; lw.appendChild(sp); });
      cell.appendChild(lw);
    }
    if (myRes.length) {
      const dots = document.createElement('div'); dots.className = 'cal-dots';
      myRes.slice(0, 6).forEach(() => { const dot = document.createElement('div'); dot.className = 'cal-dot am'; dots.appendChild(dot); });
      cell.appendChild(dots);
    }
    cell.onclick = () => openReserveModal(key);
    grid.appendChild(cell);
  }
}

$('pairFilterRow').addEventListener('click', e => {

function namesForDay(key){
  return [...new Set([...Core.reservations.filter(r => r.dateKey === key).map(r => r.name), ...(attendance[key] || [])])];
}
function daysInView(includeLeaderDays){
  const mp = monthPrefix(), set = new Set();
  Core.reservations.forEach(r => { if (r.dateKey.startsWith(mp)) set.add(r.dateKey); });
  Object.keys(attendance).forEach(k => { if (k.startsWith(mp) && (attendance[k] || []).length) set.add(k); });
  if (includeLeaderDays) Object.keys(Core.settings.leaders).forEach(k => { if (k.startsWith(mp)) set.add(k); });
  let days = [...set].sort();
  if (pairFilter !== 'all') days = days.filter(k => Core.dowOf(k) === Number(pairFilter));
  return days;
}
function renderAssignView(){
  const sec = $('assignSection'), box = $('assignList');

  if (!days.length) { sec.style.display = 'none'; return; }
  sec.style.display = '';

    const d = Number(key.split('-')[2]), dow = Core.dowOf(key);
    const L = leadersFor(key);
    const names = namesForDay(key);
    const lHtml = L.list.map(l => `<span class="assign-leader-tag">👤 ${esc(l.name)}${timeSuffix(l)}${L.weekly ? ' <small>(' + DOW_KR[dow] + '요일)</small>' : ''}</span>`).join('');

        <span class="assign-cnt">${names.length}명</span>
      </div>
      <div class="assign-body"><div class="assign-names">${names.length ? names.map(n => `<span class="assign-tag am">${esc(n)}</span>`).join('') : '<span class="assign-empty">없음</span>'}</div></div>
    </div>`;
  }).join('');
}
const pairRef = key => Core.db.collection('pairs').doc(key);
const samePair = (p, q) => p.a === q.a && p.b === q.b;
async function updatePairs(key, mutate, label, okMsg){
  await run(label, () => Core.db.runTransaction(async tx => {
    const s = await tx.get(pairRef(key));
    const list = s.exists && Array.isArray(s.data().list) ? s.data().list.map(p => ({ ...p })) : [];
    mutate(list);
    tx.set(pairRef(key), { list });
  }), okMsg);
}
function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function renderPairView(){
  const box = $('pairList');
  const days = daysInView(false);
  box.innerHTML = '';
  if (!days.length) { box.innerHTML = '<div class="pair-empty">이 달 예약이 없어요</div>'; return; }
  days.forEach(key => {
    const d = Number(key.split('-')[2]), dow = Core.dowOf(key);
    const names = namesForDay(key);
    const list = pairs[key] || [];
    const card = el('div', 'pair-date-card');
    const hdr = el('div', 'pair-date-hdr');
    hdr.append(el('div', 'pair-date-title ' + (dow === 0 ? 'sun' : dow === 6 ? 'sat' : ''), `${curMonth}월 ${d}일 (${DOW_KR[dow]})`), el('span', 'pair-date-cnt', names.length + '명'));
    card.appendChild(hdr);
    const body = el('div', 'pair-body');
    const paired = new Set(list.flatMap(p => [p.a, p.b]));
    const unpaired = names.filter(n => !paired.has(n));
    const listEl = el('div', 'pair-list');
    list.forEach((p, i) => {
      if (p.carGroup && (i === 0 || list[i-1].carGroup !== p.carGroup)) {
        const carHdr = el('div', null, `🚗 ${p.carGroup} 차 탑승`);
        carHdr.style.cssText = 'padding:5px 8px;background:#fff8e1;border-radius:7px;border:1.5px solid #f9a825;margin-bottom:4px;font-size:12px;font-weight:700;color:#7a5800';
        listEl.appendChild(carHdr);
      }
      const row = el('div', 'pair-row paired'); row.style.cssText = 'flex-wrap:wrap;gap:5px';
      const nm = el('span', 'pair-names'); nm.style.minWidth = '0';
      nm.append(document.createTextNode(p.a), el('span', 'pair-b', '+'), document.createTextNode(p.b));
      row.append(el('span', 'pair-num', String(i + 1)), nm);
      if (Core.isAdmin) {
        const inp = el('input', 'pair-card-input'); inp.type = 'text'; inp.maxLength = 10; inp.placeholder = '구역번호'; inp.value = p.card || '';
        const save = el('button', 'pair-card-save', '저장'); save.type = 'button';
        save.onclick = () => { const val = inp.value.trim(); updatePairs(key, l => { const t = l.find(x => samePair(x, p)); if (!t) throw new Error('배정이 바뀌었어요. 다시 시도하세요'); t.card = val; }, '저장 중...', val ? `✅ 구역 ${val}번 저장됐어요` : '🗑 구역 번호 삭제됐어요'); };
        const del = el('button', 'pair-del-btn', '✕'); del.type = 'button'; del.title = '배정 해제';
        del.onclick = () => { if (!confirm('이 배정을 해제할까요?')) return; updatePairs(key, l => { const j = l.findIndex(x => samePair(x, p)); if (j >= 0) l.splice(j, 1); }, '삭제 중...', '🗑 배정 해제됐어요'); };
        row.append(inp, save, del);
      } else {
        const badge = el('span', 'pair-card-badge', p.card ? `🗺️ ${p.card}` : '🗺️ —');
        if (!p.card) badge.style.cssText = 'opacity:.45;border-style:dashed';
        row.appendChild(badge);
      }
      listEl.appendChild(row);
    });
    unpaired.forEach(name => {
      const row = el('div', 'pair-row unpaired'); row.style.cssText = 'flex-wrap:nowrap;gap:5px;align-items:center';
      row.append(el('span', 'pair-num', '—'), el('span', 'pair-heart', '👤'), el('span', 'pair-solo-name', name), el('span', 'pair-solo-badge', '미배정'));
      if (Core.isAdmin) {
        const others = unpaired.filter(x => x !== name);
        if (others.length) {
          const sel = document.createElement('select');
          sel.style.cssText = 'padding:4px 6px;border:1.5px solid var(--border);border-radius:6px;font-family:inherit;font-size:12px;background:var(--surface2);outline:none;max-width:96px;flex-shrink:0;min-height:34px';
          sel.append(new Option('선택...', ''), ...others.map(x => new Option(x, x)));
          const btn = el('button', null, '🤝 배정'); btn.type = 'button';
          btn.style.cssText = 'padding:4px 10px;background:var(--green);color:#fff;border:none;border-radius:6px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0;min-height:34px';
          btn.onclick = () => {
            const partner = sel.value; if (!partner) { toast('배정할 상대를 선택하세요'); return; }
            updatePairs(key, l => { if (l.some(x => [x.a, x.b].includes(name) || [x.a, x.b].includes(partner))) throw new Error('이미 다른 짝에 배정된 사람이 있어요'); l.push({ time:'오전', a:name, b:partner, card:'' }); }, '저장 중...', `✅ ${name} + ${partner} 배정 완료!`);
          };
          row.append(sel, btn);
        } else {
          const w = el('span', null, '⏳ 대기중'); w.style.cssText = 'font-size:10px;color:var(--text3);padding:3px 8px;white-space:nowrap;flex-shrink:0';
          row.appendChild(w);
        }
      }
      listEl.appendChild(row);
    });
    if (!names.length && !list.length) listEl.appendChild(el('span', 'pair-empty', '예약자 없음'));
    const sec = el('div', 'pair-time-section'); sec.appendChild(listEl); body.appendChild(sec);
    if (Core.isAdmin && names.length) {
      const adminSec = el('div', 'pair-admin-section');
      adminSec.appendChild(el('div', 'pair-admin-lbl', '✏️ 짝 배정 (관리자)'));
      const clear = el('button', null, '🗑 이 날 전체 배정 삭제'); clear.type = 'button';
      clear.style.cssText = 'width:100%;padding:8px;background:#e53935;color:#fff;border:none;border-radius:9px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;margin-bottom:8px';
      clear.onclick = async () => { if (!confirm('이 날의 모든 짝 배정을 삭제할까요?')) return; await run('삭제 중...', () => pairRef(key).delete(), '🗑 전체 배정이 삭제됐어요'); };
      const auto = el('button', null, '🚗 차량 기반 자동 짝 배정 (한 차 4명)'); auto.type = 'button';
      auto.style.cssText = 'width:100%;padding:9px;background:#1565c0;color:#fff;border:none;border-radius:9px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;margin-bottom:10px';
      auto.onclick = () => autoCarPairs(key, names);
      adminSec.append(clear, auto);
      body.appendChild(adminSec);
    }
    card.appendChild(body);
    box.appendChild(card);
  });
}

// 차 1대 = 형제 짝 + 자매 짝 (최대 4명), 부부는 가능하면 같은 짝/같은 차
async function autoCarPairs(key, names){
  if (!confirm('차량 기반으로 자동 배정할까요?\n한 차 4명 기준이며, 기존 짝은 초기화됩니다.')) return;
  const unknown = names.filter(n => Core.genderOf(n) === 'U');
  const has = n => Core.hasCar(n);
  const bAll = names.filter(n => Core.genderOf(n) === 'M'), sAll = names.filter(n => Core.genderOf(n) === 'F');
  if (!names.some(has)) { toast('참석자 중 차량 보유자가 없어요. 성원 탭에서 🚗를 등록해 주세요'); return; }
  function makePairs(pool){
    const cQ = pool.filter(has), fQ = pool.filter(n => !has(n)), out = [];
    while (cQ.length && fQ.length) { const d = cQ.shift(); out.push({ a:d, b:fQ.shift(), driver:d }); }
    while (fQ.length >= 2) out.push({ a:fQ.shift(), b:fQ.shift(), driver:null });
    while (cQ.length >= 2) { const d = cQ.shift(); out.push({ a:d, b:cQ.shift(), driver:d }); }
    if (cQ.length) out.push({ a:cQ[0], b:null, driver:cQ[0], solo:true });
    if (fQ.length) out.push({ a:fQ[0], b:null, driver:null, solo:true });
    return out;
  }
  const all = [...makePairs(bAll), ...makePairs(sAll)];
  // 혼자 남은 사람: 부부끼리 짝
  const solos = all.filter(p => p.solo), used = new Set(), extra = [];
  solos.forEach(sp => {
    if (used.has(sp.a)) return;
    const spouse = Core.spouseOf(sp.a);
    if (!spouse || !names.includes(spouse)) return;
    const match = solos.find(x => x.a === spouse && !used.has(x.a));
    if (match) { extra.push({ a:sp.a, b:match.a, driver:has(sp.a) ? sp.a : has(match.a) ? match.a : null }); used.add(sp.a); used.add(match.a); }
  });
  const pairsAll = [...all.filter(p => !p.solo), ...extra];
  const leftover = solos.filter(p => !used.has(p.a)).map(p => p.a);
  const drivers = [...new Set(pairsAll.map(p => p.driver).filter(Boolean))];
  if (!drivers.length) { toast('짝을 지을 수 있는 차량 보유자가 없어요'); return; }
  const carMap = Object.fromEntries(drivers.map(d => [d, []]));
  pairsAll.filter(p => p.driver).forEach(p => carMap[p.driver].push(p));
  const load = d => carMap[d].length * 2;
  pairsAll.filter(p => !p.driver).forEach(p => { const t = [...drivers].sort((a, b) => load(a) - load(b))[0]; carMap[t].push(p); });
  // 2명뿐인 차끼리 합쳐 4명 채우기
  const small = drivers.filter(d => load(d) <= 2);
  for (let i = 0; i + 1 < small.length; i += 2) { carMap[small[i]].push(...carMap[small[i+1]]); carMap[small[i+1]] = []; }
  const liveDrivers = drivers.filter(d => carMap[d].length);
  const save = liveDrivers.flatMap(d => carMap[d].map(p => ({ time:'오전', a:p.a, b:p.b, card:'', carGroup:d })));
  if (!save.length) { toast('배정할 수 없어요'); return; }
  const preview = liveDrivers.map(d => `${d} 차 (${load(d)}명): ${carMap[d].map(p => p.a + '+' + p.b).join(', ')}`).join('\n');
  const notes = [leftover.length ? '\n짝 없음: ' + leftover.join(', ') : '', unknown.length ? '\n성별 미지정(제외됨): ' + unknown.join(', ') : ''].join('');
  if (!confirm('배정 결과:\n\n' + preview + notes + '\n\n저장할까요?')) return;
  await run('배정 중...', () => pairRef(key).set({ list:save }), `✅ ${save.length}쌍 배정 완료!`);
}

// ── 관리 탭 ──
function renderAdminPage(){
  if (!Core.isAdmin) return;
  const wl = Core.settings.weeklyLeaders;
  const wEntries = Object.entries(wl).filter(([, a]) => Array.isArray(a) && a.length).sort((a, b) => +a[0] - +b[0]);
  $('weeklyLeaderList').innerHTML = wEntries.length ? wEntries.map(([dow, arr]) => arr.map((l, li) => `
    <div class="leader-item"><span class="li-date" style="min-width:44px">${DOW_KR[dow]}요일</span>
      <span class="badge badge-${l.time === '오전' ? 'green' : l.time === '오후' ? 'orange' : 'blue'}" style="font-size:10px">${esc(l.time)}</span>
      <span class="li-name">${esc(l.name)}</span>
      <button class="li-del" type="button" data-wdel="${esc(dow)}|${li}" aria-label="삭제">✕</button></div>`).join('')).join('')
    : '<div class="empty-msg">등록된 요일 인도자 없음</div>';
  $('leaderCardTitle').textContent = `🙋 날짜별 특별 인도자 (${curYear}년 ${curMonth}월)`;
  const entries = Object.entries(Core.settings.leaders).filter(([k]) => k.startsWith(monthPrefix())).sort();
  $('leaderList').innerHTML = entries.length ? entries.map(([key, arr]) => arr.map((l, li) => `
    <div class="leader-item"><span class="li-date">${Number(key.split('-')[2])}일</span>
      <span class="badge badge-${l.time === '오전' ? 'green' : l.time === '오후' ? 'orange' : 'blue'}" style="font-size:10px">${esc(l.time)}</span>
      <span class="li-name">${esc(l.name)}</span>
      <button class="li-del" type="button" data-ldel="${esc(key)}|${li}" aria-label="삭제">✕</button></div>`).join('')).join('')
    : '<div class="empty-msg">이 달 특별 인도자 없음</div>';
  $('adminList').innerHTML = Core.adminList().map(a => `<span class="admin-tag" style="display:inline-flex;align-items:center;gap:5px;background:var(--blue-bg);color:var(--blue);border-radius:50px;padding:3px 11px;font-size:12px;font-weight:600;margin:3px">
      ${esc(a.name)}${a.legacy ? '<span class="legacy-badge">옛 방식</span>' : ''}
      ${Core.isMe(a.id) ? '(나)' : `<button type="button" data-adel="${esc(a.id)}" style="background:none;border:none;color:var(--blue2);cursor:pointer;font-size:13px;padding:0;min-height:0" aria-label="${esc(a.name)} 삭제">✕</button>`}
    </span>`).join('') || '<div class="empty-msg">등록된 관리자 없음</div>';
  const r = Core.roster || [];
  $('rosterInfo').textContent = Core.rosterExists
    ? `현재 ${r.length}명 (형제 ${r.filter(m => m.gender === 'M').length} · 자매 ${r.filter(m => m.gender === 'F').length} · 미지정 ${r.filter(m => m.gender === 'U').length} · 차량 ${r.filter(m => m.car).length}). 가져오기를 하면 현재 명단이 파일 내용으로 바뀝니다.`
    : '아직 공유 명단이 없습니다. 함께 드린 명단 JSON 파일을 가져오세요.';
}
document.addEventListener('click', async e => {
  const w = e.target.closest('[data-wdel]'), l = e.target.closest('[data-ldel]'), a = e.target.closest('[data-adel]');
  if (w) {
    const [dow, li] = w.dataset.wdel.split('|');
    const weekly = JSON.parse(JSON.stringify(Core.settings.weeklyLeaders));
    (weekly[dow] || []).splice(Number(li), 1);
    if (weekly[dow] && !weekly[dow].length) delete weekly[dow];
    await run('삭제 중...', () => Core.saveLeaders(Core.settings.leaders, weekly), '🗑 삭제됐어요');
  }
  if (l) {
    const [key, li] = l.dataset.ldel.split('|');
    const leaders = JSON.parse(JSON.stringify(Core.settings.leaders));
    (leaders[key] || []).splice(Number(li), 1);
    if (leaders[key] && !leaders[key].length) delete leaders[key];
    await run('삭제 중...', () => Core.saveLeaders(leaders, Core.settings.weeklyLeaders), '🗑 삭제됐어요');
  }
  if (a) {
    const item = Core.adminList().find(x => x.id === a.dataset.adel);
    if (item && confirm(`'${item.name}' 관리자를 삭제할까요?`)) await run('삭제 중...', () => Core.deleteAdmin(item.id), '🗑 관리자 삭제됐어요');
  }
});
$('addWeeklyBtn').onclick = async () => {
  const dow = $('wkDay').value, time = $('wkTime').value, name = $('wkLeader').value.trim();
  if (!name) { toast('이름을 입력하세요'); return; }
  const weekly = JSON.parse(JSON.stringify(Core.settings.weeklyLeaders));
  weekly[dow] = weekly[dow] || [];
  if (weekly[dow].length >= 2) { toast('요일당 최대 2명'); return; }
  weekly[dow].push({ time, name });
  const r = await run('저장 중...', () => Core.saveLeaders(Core.settings.leaders, weekly), `✅ ${DOW_KR[dow]}요일 인도자 등록됐어요`);
  if (r) $('wkLeader').value = '';
};
$('addLeaderBtn').onclick = async () => {
  const d = parseInt($('adminDate').value, 10), time = $('adminTime').value, name = $('adminLeader').value.trim();
  const last = new Date(curYear, curMonth, 0).getDate();
  if (!d || d < 1 || d > last || !name) { toast(`날짜(1~${last})와 이름을 입력하세요`); return; }
  const key = Core.toKey(curYear, curMonth, d);
  const leaders = JSON.parse(JSON.stringify(Core.settings.leaders));
  leaders[key] = leaders[key] || [];
  if (leaders[key].length >= 2) { toast('날짜당 최대 2명'); return; }
  leaders[key].push({ time, name });
  const r = await run('저장 중...', () => Core.saveLeaders(leaders, Core.settings.weeklyLeaders), `✅ ${d}일 인도자 등록됐어요`);
  if (r) { $('adminDate').value = ''; $('adminLeader').value = ''; }
};
$('addAdminBtn').onclick = async () => {
  const name = $('newAdminName').value.trim(), pw = $('newAdminPw').value;
  const res = await run('관리자 추가 중...', () => Core.registerAdmin(name, pw));
  if (!res) return;
  const warn = res.value;
  $('newAdminName').value = ''; $('newAdminPw').value = '';
  toast('✅ 관리자 추가됐어요'); if (warn) alert(warn);
};
$('importRosterBtn').onclick = () => $('rosterFile').click();
$('rosterFile').onchange = async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = ''; if (!f) return;
  let json;
  try { json = JSON.parse(await f.text()); } catch { toast('❌ JSON 파일을 읽지 못했어요'); return; }
  const n = (Array.isArray(json) ? json : json.members || []).length;
  if (!confirm(`명단 파일의 ${n}명으로 공유 명단을 바꿀까요?` + (Core.rosterExists ? '\n(현재 명단은 이 파일 내용으로 교체됩니다)' : ''))) return;
  const res = await run('명단 저장 중...', () => Core.importRoster(json));
  const r = res && res.value;
  if (r) alert(`✅ 명단 ${r.count}명을 저장했습니다.` + (r.notes.length ? '\n\n' + r.notes.join('\n') : ''));
};
$('exportRosterBtn').onclick = () => {
  const data = { format:'gyeongju-dongbu-roster', exportedAt:new Date().toISOString(), mergeOldCloudData:false,
    members:(Core.roster || []).map(m => ({ name:m.name, gender:m.gender, group:m.group, role:m.role, car:m.car })), couples:Core.couples };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = '경주동부_성원명단_' + Core.todayKey() + '.json'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
};
$('clearMonthBtn').onclick = async () => {
  if (!confirm(`${curYear}년 ${curMonth}월 예약을 전부 삭제할까요?`)) return;
  const mp = monthPrefix();
  await run('삭제 중...', async () => {
    const docs = (await Core.db.collection('reservations').where('dateKey', '>=', mp + '-01').where('dateKey', '<=', mp + '-31').get()).docs;
    for (let i = 0; i < docs.length; i += 400) { const b = Core.db.batch(); docs.slice(i, i + 400).forEach(d => b.delete(d.ref)); await b.commit(); }
  }, '🗑 이 달 예약이 삭제됐어요');
};

// ── 자료 구독 ──
function subscribeLocal(){
  if (!Core.db) return false;
  Core.db.collection('attendance').onSnapshot(snap => {
    attendance = {}; snap.docs.forEach(d => { attendance[d.id] = Array.isArray(d.data().names) ? d.data().names : []; });
    if (isTabOn('members')) renderMemberList();
    if (isTabOn('pairs')) { renderAssignView(); renderPairView(); }
  }, err => console.warn('참석 자료:', err.code));
  Core.db.collection('pairs').onSnapshot(snap => {
    pairs = {}; snap.docs.forEach(d => { pairs[d.id] = Array.isArray(d.data().list) ? d.data().list : []; });
    if (isTabOn('pairs')) renderPairView();
  }, err => console.warn('배정 자료:', err.code));
  return true;
}
let subscribed = Core.started && subscribeLocal();
Core.on('auth', () => { if (!subscribed) subscribed = subscribeLocal(); });
Core.on('reservations', renderAll);
Core.on('settings', renderAll);
Core.on('roster', () => { updateRosterNotice(); renderAll(); });
Core.on('admins', () => { if (isTabOn('admin')) renderAdminPage(); });
Core.on('admin', applyAdminUI);

// 자정이 지나면 오늘 날짜를 다시 계산
setInterval(() => { const t = Core.todayKey(); if (t !== lastToday) { lastToday = t; renderAll(); } }, 60000);

applyAdminUI();
<\/script>
</body>
</html>
</script>
<script type="text/plain" id="tpl-display"><!doctype html>
<html lang="ko">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>전시대 팀 자동 배정</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6f8;--card:#fff;--line:#dce3e8;--text:#18222b;--muted:#687782;--accent:#176b55;--blue:#1d6fbd;--danger:#a33a3a}
*{box-sizing:border-box}
html,body{width:100%;max-width:100%;overflow-x:hidden}

.person.car-owner{background:#eaf4ff;border-left:4px solid #2878c8}
.person.reserved .name::after{content:"예약";margin-left:5px;font-size:10px;font-weight:700;color:#176b55;background:#e3f3ec;border-radius:999px;padding:1px 6px;vertical-align:middle}
.name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person.car-owner .name{color:#0f5fae}
.meta{font-size:12px;color:var(--muted)}
.sex{min-height:36px;padding:3px 6px;font-size:13px}
.sex.unknown,.tag-unknown{background:#fff6e5}
.tag{font-size:12px;border-radius:999px;padding:2px 8px;background:#eef2f4;white-space:nowrap}
.car-toggle{display:flex;align-items:center;gap:3px;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:0 6px;height:36px;cursor:pointer;user-select:none}
.car-toggle input{width:18px;height:18px;min-height:0;margin:0}
.car-mark{display:inline-block;margin-left:5px;padding:1px 6px;border-radius:999px;background:#2878c8;color:#fff;font-size:11px;font-weight:800;vertical-align:middle}
.delete-person{min-height:34px;padding:3px 8px;border:1px solid #e0b9b9;background:#fff5f5;color:var(--danger);font-weight:400;font-size:12px}
.team{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden;break-inside:avoid}
.team-title{padding:9px 11px;background:#edf7f3;font-weight:800;display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}
.team-members{display:grid;grid-template-columns:1fr 1fr}
.member{padding:8px 10px;border-top:1px solid #edf1f3}
.member:nth-child(odd){border-right:1px solid #edf1f3}
.member.bro{font-weight:700}
.member.car-owner-member{background:#eef6ff;color:#0f5fae;font-weight:700}
.notice{padding:10px 12px;background:#fff7e8;border:1px solid #f0d7a8;border-radius:10px;margin:0 0 10px;color:#6f4d0a;font-size:13px}
.empty{padding:28px 14px;text-align:center;color:var(--muted)}
.small{font-size:12px;color:var(--muted)}
@media(max-width:800px){
  .app-shell{padding:6px 6px 20px}
  .topbar{position:static;border-radius:10px}
  .main-grid{grid-template-columns:1fr;gap:8px}
  #peopleList,#teams{max-height:none}
  .tool-group{width:100%}
  .tool-group button{flex:1 1 auto}
  .team-members{grid-template-columns:1fr}
  .member:nth-child(odd){border-right:0}
}
@media(max-width:520px){
  .person{grid-template-columns:30px minmax(0,1fr) auto;grid-template-areas:"chk name del" "chk sex car";row-gap:4px}
  .person>.chk{grid-area:chk}.person>.info{grid-area:name}.person>.sexbox{grid-area:sex}.person>.carbox{grid-area:car}.person>.delbox{grid-area:del}
  .person .name{font-size:16px}
}
@media(min-width:1401px){.app-shell{max-width:1560px}.team-members{grid-template-columns:1fr 1fr 1fr}.member{border-right:0!important}}
@media print{
  .topbar,.compact-note,#peoplePanel{display:none!important}
  .main-grid{display:block}
  #teams{max-height:none;overflow:visible}
  .section-card{border:none;box-shadow:none}
  body{background:#fff}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body><div class="app-shell">
<div class="topbar">
  <div class="topbar-head">
    <div>
      <div class="topbar-title">전시대 팀 자동 배정</div>
      <div class="topbar-sub">25명 이하 1팀 6명 · 26명 이상 1팀 8명 · 차량 보유자 분산 · 반복 조합 최소화</div>
    </div>
    <div id="syncState" class="small">연결 중…</div>
  </div>
  <div class="toolbar">
    <div class="tool-group">
      <input id="workDate" type="date" aria-label="날짜">
      <button id="todayBtn" type="button">오늘</button>
    </div>
    <div class="tool-group grow"><input id="search" type="search" placeholder="이름·집단 검색" aria-label="이름 검색"></div>
    <div class="tool-group">
      <button id="selectAllBtn" class="success-tool" type="button">보이는 사람 전체 체크</button>
      <button id="clearBtn" type="button">체크 해제</button>
      <button id="addPersonBtn" type="button" style="display:none">+ 이름 추가</button>
    </div>
    <div class="tool-group">
      <button id="assignBtn" class="primary-tool" type="button">자동 팀 배정</button>
      <button id="printBtn" type="button">인쇄</button>
      <button id="resetHistoryBtn" class="danger-tool" type="button" style="display:none">팀 이력 초기화</button>
    </div>
  </div>
  <div class="add-person-box" id="addPersonBox">
    <input id="newPersonName" type="text" placeholder="추가할 이름" maxlength="20">
    <select id="newPersonGender"><option value="M">형제</option><option value="F">자매</option><option value="U">미지정</option></select>
    <button class="primary-tool" id="savePersonBtn" type="button">추가</button>
    <button id="cancelPersonBtn" type="button">취소</button>
  </div>
  <div class="summary">
    <span class="badge">선택 <b id="selectedCount">0</b>명</span>
    <span class="badge">형제 <b id="broCount">0</b></span>
    <span class="badge">자매 <b id="sisCount">0</b></span>
    <span class="badge warn" id="unkBadge" style="display:none">미지정 <b id="unkCount">0</b></span>
    <span class="badge" id="resBadge" style="display:none">금요일 예약 <b id="resCount">0</b>명 자동 체크</span>
  </div>
</div>
<div class="compact-note" id="roleNote"></div>

<div class="main-grid">
  <section class="section-card" id="peoplePanel">
    <div class="section-head"><span>참석자 체크</span><span class="small" id="peopleCount"></span></div>
    <div id="peopleList"></div>
  </section>
  <section class="section-card" id="teamPanel">
    <div class="section-head"><span>자동 배정 결과</span><span class="small" id="teamDate"></span></div>
    <div id="teams"></div>
  </section>
</div>
</div>

<script>
'use strict';
const Core = window.parent && window.parent.Core;
if (!Core) { document.body.innerHTML = '<p style="padding:20px">이 화면은 통합 앱 안에서 열어야 합니다.</p>'; throw new Error('Core 없음'); }
const $ = id => document.getElementById(id);
const HISTORY_DAYS = 180;

let docs = {};            // dateKey -> {checked, removed, teams, carWarning}
let docsLoaded = false;
let userPickedDate = false;
let selDate = (() => { try { const v = localStorage.getItem('displayDate'); return Core.isDateKey(v) && v >= Core.todayKey() ? v : Core.todayKey(); } catch { return Core.todayKey(); } })();

function setDate(key, byUser){
  if (!Core.isDateKey(key)) key = Core.todayKey();
  selDate = key; if (byUser) userPickedDate = true;
  try { localStorage.setItem('displayDate', key); } catch {}
  $('workDate').value = key;
  render();
}
const ref = key => Core.db.collection('display').doc(key);
const docOf = key => docs[key] || { checked:[], removed:[], teams:[], carWarning:'' };
const isFriday = key => Core.dowOf(key) === 5;
const reservedNames = key => isFriday(key) ? [...new Set(Core.reservations.filter(r => r.dateKey === key).map(r => r.name))] : [];
function attendees(key){
  const d = docOf(key), removed = new Set(d.removed || []);
  return [...new Set([...reservedNames(key), ...(d.checked || [])])].filter(n => !removed.has(n));
}
function status(text, bad){ $('syncState').textContent = text; $('syncState').style.color = bad ? '#a33a3a' : ''; }
async function save(fn, okText){
  try { await fn(); status(okText || '저장됨 · ' + new Date().toLocaleTimeString('ko-KR', { hour:'2-digit', minute:'2-digit' })); return true; }
  catch (e) { console.error(e); status('저장 실패', true); alert('저장하지 못했습니다: ' + (e.code === 'permission-denied' ? '권한이 없어요' : (e.message || e.code))); return false; }
}
const FV = () => Core.FieldValue;

// ── 그리기 ──
function allRows(){
  const roster = Core.roster || [];
  const names = new Set(roster.map(m => m.name));
  // 명단 외 이름(예약만 한 사람)은 체크를 해제해도 줄이 남아 있어야 다시 체크할 수 있음
  const d = docOf(selDate);
  const extra = [...new Set([...reservedNames(selDate), ...(d.checked || [])])].filter(n => !names.has(n)).map(n => ({ name:n, gender:'U', group:'명단 외', role:'', car:false, extra:true }));
  return [...roster, ...extra].sort((a, b) => a.name.localeCompare(b.name, 'ko'));
}
function render(){ renderPeople(); renderTeams(); }
function renderPeople(){
  const q = $('search').value.trim();
  const box = $('peopleList'); box.replaceChildren();
  const admin = Core.isAdmin;
  $('addPersonBtn').style.display = admin ? '' : 'none';
  $('resetHistoryBtn').style.display = admin ? '' : 'none';
  $('roleNote').textContent = admin
    ? '관리자 모드: 형제/자매 구분·차량·이름 추가/삭제는 공유 명단에 바로 저장되어 야외 봉사 화면에도 반영됩니다.'
    : '금요일 야외 봉사 예약자는 자동으로 체크됩니다. 체크와 배정 결과는 모든 기기에 실시간으로 공유됩니다. 형제/자매 구분·차량 수정은 관리자 로그인 후 할 수 있어요.';
  if (Core.roster === null) { box.innerHTML = '<div class="empty">명단 불러오는 중…</div>'; updateSummary(); return; }
  const att = new Set(attendees(selDate)), res = new Set(reservedNames(selDate));
  const rows = allRows().filter(p => !q || p.name.includes(q) || String(p.group || '').includes(q));
  $('peopleCount').textContent = rows.length + '명';
  if (!rows.length) box.innerHTML = '<div class="empty">' + ((Core.roster || []).length ? '검색 결과가 없어요' : '공유 명단이 비어 있어요. 관리자가 야외 봉사 → 관리 탭에서 명단을 가져와야 합니다.') + '</div>';
  rows.forEach(p => {
    const row = document.createElement('div');
    row.className = 'person' + (p.car ? ' car-owner' : '') + (res.has(p.name) ? ' reserved' : '');
    const chk = document.createElement('input'); chk.type = 'checkbox'; chk.className = 'chk'; chk.checked = att.has(p.name); chk.setAttribute('aria-label', p.name + ' 참석');
    chk.onchange = () => toggle(p.name, chk.checked);
    const info = document.createElement('div'); info.className = 'info'; info.style.minWidth = '0';
    const nm = document.createElement('div'); nm.className = 'name'; nm.textContent = p.name;
    if (p.car) { const m = document.createElement('span'); m.className = 'car-mark'; m.textContent = '차'; nm.appendChild(m); }
    const meta = document.createElement('div'); meta.className = 'meta'; meta.textContent = [p.group, p.role].filter(Boolean).join(' · ') || ' ';
    info.append(nm, meta);
    row.append(chk, info);
    const sexBox = document.createElement('div'); sexBox.className = 'sexbox';
    const carBox = document.createElement('div'); carBox.className = 'carbox';
    const delBox = document.createElement('div'); delBox.className = 'delbox';
    if (admin && !p.extra) {
      const sel = document.createElement('select'); sel.className = 'sex' + (p.gender === 'U' ? ' unknown' : ''); sel.setAttribute('aria-label', p.name + ' 형제/자매');
      [['M','형제'],['F','자매'],['U','미지정']].forEach(([v, l]) => sel.add(new Option(l, v, false, p.gender === v)));
      sel.onchange = () => save(() => Core.setGender(p.name, sel.value));
      sexBox.appendChild(sel);
      const lab = document.createElement('label'); lab.className = 'car-toggle'; lab.title = '자동차 보유';
      const car = document.createElement('input'); car.type = 'checkbox'; car.checked = p.car;
      car.onchange = () => save(() => Core.setCar(p.name, car.checked));
      lab.append(car, document.createTextNode(' 차')); carBox.appendChild(lab);
      const del = document.createElement('button'); del.type = 'button'; del.className = 'delete-person'; del.textContent = '삭제';
      del.onclick = () => { if (confirm(p.name + ' 이름을 공유 명단에서 지울까요?\n(야외 봉사 화면에서도 사라집니다)')) save(() => Core.removeMember(p.name)); };
      delBox.appendChild(del);
    } else {
      const t = document.createElement('span'); t.className = 'tag' + (p.gender === 'U' ? ' tag-unknown' : '');
      t.textContent = p.gender === 'M' ? '형제' : p.gender === 'F' ? '자매' : '미지정';
      sexBox.appendChild(t);
    }
    row.append(sexBox, carBox, delBox);
    box.appendChild(row);
  });
  updateSummary();
}
function updateSummary(){
  const sel = attendees(selDate);
  const g = n => Core.genderOf(n);
  $('selectedCount').textContent = sel.length;
  $('broCount').textContent = sel.filter(n => g(n) === 'M').length;
  $('sisCount').textContent = sel.filter(n => g(n) === 'F').length;
  const u = sel.filter(n => g(n) === 'U').length;
  $('unkCount').textContent = u; $('unkBadge').style.display = u ? '' : 'none';
  const r = reservedNames(selDate).length;
  $('resCount').textContent = r; $('resBadge').style.display = r ? '' : 'none';
}
function renderTeams(){
  const box = $('teams'); box.replaceChildren();
  const d = docOf(selDate), teams = (d.teams || []).map(t => (t.members || []));
  $('teamDate').textContent = selDate + ' (' + '일월화수목금토'[Core.dowOf(selDate)] + ')';
  if (!teams.length) { box.innerHTML = '<div class="empty">참석자를 체크한 뒤 <b>자동 팀 배정</b>을 누르세요.</div>'; return; }
  const intro = document.createElement('div'); intro.className = 'small'; intro.style.margin = '0 0 10px';
  intro.textContent = '이전 팀 조합을 참고해 분산했습니다.'; box.appendChild(intro);
  if (d.carWarning) { const w = document.createElement('div'); w.className = 'notice'; w.textContent = d.carWarning; box.appendChild(w); }
  const now = new Set(attendees(selDate));
  const changed = teams.flat().some(n => !now.has(n)) || [...now].some(n => !teams.flat().includes(n));
  if (changed) { const w = document.createElement('div'); w.className = 'notice'; w.textContent = '배정 후 참석자가 바뀌었습니다. 다시 [자동 팀 배정]을 눌러 주세요.'; box.appendChild(w); }
  teams.forEach((team, i) => {
    const card = document.createElement('div'); card.className = 'team';
    const G = n => Core.genderOf(n);
    const b = team.filter(n => G(n) === 'M').length, s = team.filter(n => G(n) === 'F').length;
    const cb = team.filter(n => G(n) === 'M' && Core.hasCar(n)).length, cs = team.filter(n => G(n) === 'F' && Core.hasCar(n)).length;
    const title = document.createElement('div'); title.className = 'team-title';
    const l = document.createElement('span'); l.textContent = `${i + 1}팀 (${team.length}명)`;
    const r = document.createElement('span'); r.textContent = `형제 ${b} · 자매 ${s} · 차량 형제 ${cb} / 자매 ${cs}`;
    title.append(l, r); card.appendChild(title);
    const mem = document.createElement('div'); mem.className = 'team-members';
    team.forEach(n => {
      const m = Core.member(n) || {};
      const e = document.createElement('div');
      e.className = 'member' + (G(n) === 'M' ? ' bro' : '') + (Core.hasCar(n) ? ' car-owner-member' : '');
      e.textContent = `${n}${Core.hasCar(n) ? ' [차]' : ''} (${G(n) === 'M' ? '형제' : G(n) === 'F' ? '자매' : '미지정'}${m.group ? ' · ' + m.group : ''})`;
      mem.appendChild(e);
    });
    card.appendChild(mem); box.appendChild(card);
  });
}

// ── 체크 (필드 단위 저장이라 여러 기기가 동시에 체크해도 서로 덮지 않음) ──
function toggle(name, on){
  const fv = FV();
  save(() => ref(selDate).set(on
    ? { checked: fv.arrayUnion(name), removed: fv.arrayRemove(name), teams: [], carWarning:'', updatedAt: Date.now() }
    : { checked: fv.arrayRemove(name), removed: fv.arrayUnion(name), teams: [], carWarning:'', updatedAt: Date.now() }, { merge:true }));
}
$('selectAllBtn').onclick = () => {
  const q = $('search').value.trim();
  const names = allRows().filter(p => !q || p.name.includes(q) || String(p.group || '').includes(q)).map(p => p.name);
  if (!names.length) return;
  const fv = FV();
  save(() => ref(selDate).set({ checked: fv.arrayUnion(...names), removed: fv.arrayRemove(...names), teams: [], carWarning:'', updatedAt: Date.now() }, { merge:true }));
};
$('clearBtn').onclick = () => {
  if (!confirm(selDate + ' 참석 체크를 모두 해제할까요? (금요일 예약자 자동 체크도 해제됩니다)')) return;
  save(() => ref(selDate).set({ checked: [], removed: reservedNames(selDate), teams: [], carWarning:'', updatedAt: Date.now() }, { merge:true }));
};

// ── 자동 배정 ──
function shuffle(a){ a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function distributeEvenly(total, n){ const base = Math.floor(total / n), rem = total % n; return Array.from({ length:n }, (_, i) => base + (i < rem ? 1 : 0)); }
function buildPairCounts(excludeDate){
  const counts = new Map(), k = (a, b) => a < b ? a + '|' + b : b + '|' + a;
  const since = Core.addDays(Core.todayKey(), -HISTORY_DAYS);
  Object.entries(docs).forEach(([date, d]) => {
    if (date === excludeDate || date < since) return;
    (d.teams || []).forEach(t => { const ns = t.members || []; for (let i = 0; i < ns.length; i++) for (let j = i + 1; j < ns.length; j++) counts.set(k(ns[i], ns[j]), (counts.get(k(ns[i], ns[j])) || 0) + 1); });
  });
  return (a, b) => counts.get(k(a, b)) || 0;
}
function assignTeams(){
  const sel = attendees(selDate);
  if (!sel.length) { alert('먼저 전시대에 나올 사람을 체크해 주세요.'); return; }
  const unknown = sel.filter(n => Core.genderOf(n) === 'U');
  if (unknown.length) { alert('형제/자매가 미지정된 사람이 있습니다: ' + unknown.join(', ') + '\n관리자가 구분을 먼저 정해 주세요.'); return; }
  const pc = buildPairCounts(selDate);
  const cost = (c, team) => team.reduce((s, p) => s + pc(c, p), 0);
  const takeBest = (pool, team) => { if (!pool.length) return null; let bi = 0, bc = cost(pool[0], team); for (let i = 1; i < pool.length; i++) { const c = cost(pool[i], team); if (c < bc) { bc = c; bi = i; } } return pool.splice(bi, 1)[0]; };
  const size = sel.length > 25 ? 8 : 6;
  const n = Math.ceil(sel.length / size);
  const sizes = distributeEvenly(sel.length, n);
  const bro = shuffle(sel.filter(x => Core.genderOf(x) === 'M')), sis = shuffle(sel.filter(x => Core.genderOf(x) === 'F'));
  const carB = bro.filter(Core.hasCar), othB = bro.filter(x => !Core.hasCar(x));
  const carS = sis.filter(Core.hasCar), othS = sis.filter(x => !Core.hasCar(x));
  const bCnt = distributeEvenly(bro.length, n), sCnt = sizes.map((s, i) => s - bCnt[i]);
  const cbT = distributeEvenly(carB.length, n), csT = distributeEvenly(carS.length, n);
  const pick = (team, count, carPool, regPool, carTarget) => {
    let left = count;
    for (let i = 0; i < Math.min(carTarget, count); i++) { const p = takeBest(carPool, team); if (!p) break; team.push(p); left--; }
    while (left > 0) { const p = regPool.length ? takeBest(regPool, team) : takeBest(carPool, team); if (!p) break; team.push(p); left--; }
  };
  const teams = [];
  for (let i = 0; i < n; i++) { const t = []; pick(t, bCnt[i], carB, othB, cbT[i]); pick(t, sCnt[i], carS, othS, csT[i]); teams.push(t); }
  // 남은 사람(한쪽 성별이 모자란 경우)을 가장 작은 팀부터 채움
  [...carB, ...othB, ...carS, ...othS].forEach(p => teams.sort((a, b) => a.length - b.length)[0].push(p));
  const flat = teams.flat();
  if (flat.length !== sel.length || new Set(flat).size !== flat.length || sel.some(x => !flat.includes(x))) { alert('팀 배정 검증에 실패해 저장하지 않았습니다. 다시 시도해 주세요.'); return; }
  const hasB = teams.filter(t => t.some(x => Core.genderOf(x) === 'M' && Core.hasCar(x))).length;
  const hasS = teams.filter(t => t.some(x => Core.genderOf(x) === 'F' && Core.hasCar(x))).length;
  const carWarning = hasB < n || hasS < n ? `차량 보유자 분산 안내: 차량 보유 형제 포함 ${hasB}/${n}팀, 차량 보유 자매 포함 ${hasS}/${n}팀입니다.` : '';
  save(() => ref(selDate).set({ teams: teams.map(t => ({ members:t })), carWarning, updatedAt: Date.now() }, { merge:true }), '배정 저장됨');
}
$('assignBtn').onclick = assignTeams;
$('printBtn').onclick = () => window.print();
$('resetHistoryBtn').onclick = async () => {
  if (!Core.isAdmin) return;
  if (!confirm('지금까지 저장된 팀 배정 이력을 모두 지울까요?\n(선택한 날짜의 현재 배정은 남겨 둡니다)')) return;
  const keys = Object.keys(docs).filter(k => k !== selDate && (docs[k].teams || []).length);
  await save(async () => { for (let i = 0; i < keys.length; i += 400) { const b = Core.db.batch(); keys.slice(i, i + 400).forEach(k => b.set(ref(k), { teams: [], carWarning:'' }, { merge:true })); await b.commit(); } }, '이력 초기화됨');
};

// ── 이름 추가 (관리자) ──
$('addPersonBtn').onclick = () => { $('addPersonBox').classList.add('show'); $('newPersonName').value = ''; $('newPersonName').focus(); };
$('cancelPersonBtn').onclick = () => $('addPersonBox').classList.remove('show');
async function addNewPerson(){
  const name = $('newPersonName').value.trim().replace(/\s+/g, ' ');
  if (!name) { alert('이름을 입력해 주세요.'); return; }
  if (Core.member(name)) { alert('이미 등록된 이름입니다.'); return; }
  if (await save(() => Core.addMember(name, $('newPersonGender').value))) $('addPersonBox').classList.remove('show');
}
$('savePersonBtn').onclick = addNewPerson;
$('newPersonName').addEventListener('keydown', e => { if (e.key === 'Enter') addNewPerson(); });

// ── 날짜 / 검색 ──
$('workDate').onchange = () => setDate($('workDate').value, true);
$('todayBtn').onclick = () => setDate(Core.todayKey(), true);
$('search').oninput = renderPeople;
// 처음 열 때만: 오늘 예약이 없으면 가장 가까운 금요일 예약일로 맞춤 (직접 고른 날짜는 바꾸지 않음)
function autoPickDate(){
  if (userPickedDate || reservedNames(selDate).length || (docOf(selDate).checked || []).length) return;
  const today = Core.todayKey();
  const next = [...new Set(Core.reservations.map(r => r.dateKey))].filter(k => k >= today && isFriday(k)).sort()[0];
  if (next && next !== selDate) setDate(next, false);
}
setInterval(() => { if (selDate < Core.todayKey()) setDate(Core.todayKey(), false); }, 60000);

// ── 예전 기기 저장 자료(팀 이력) 한 번 옮기기 ──
async function migrateOldHistory(){
  try {
    if (localStorage.getItem('display_history_migrated')) return;
    const raw = localStorage.getItem('display_team_planner_v1');
    const hist = raw ? (JSON.parse(raw).history || {}) : {};
    const since = Core.addDays(Core.todayKey(), -HISTORY_DAYS);
    const keys = Object.keys(hist).filter(k => Core.isDateKey(k) && k >= since && Array.isArray(hist[k]) && !(docs[k] && (docs[k].teams || []).length));
    for (let i = 0; i < keys.length; i += 400) {
      const b = Core.db.batch();
      keys.slice(i, i + 400).forEach(k => b.set(ref(k), { teams: hist[k].map(t => ({ members:(t || []).map(x => typeof x === 'string' ? x : x && x.name).filter(Boolean) })), updatedAt: Date.now() }, { merge:true }));
      await b.commit();
    }
    localStorage.setItem('display_history_migrated', '1');
    if (keys.length) console.info('이 기기의 예전 팀 이력 ' + keys.length + '일분을 공유 자료로 옮겼습니다.');
  } catch (e) { console.warn('예전 팀 이력 이전 실패:', e.code || e.message); }
}

// ── 구독 ──
let subscribed = false;
function subscribe(){
  if (subscribed || !Core.started) return;
  subscribed = true;
  Core.db.collection('display').onSnapshot(snap => {
    docs = {};
    snap.docs.forEach(d => { if (Core.isDateKey(d.id)) { const x = d.data(); docs[d.id] = { checked:x.checked || [], removed:x.removed || [], teams:Array.isArray(x.teams) ? x.teams : [], carWarning:x.carWarning || '' }; } });
    const first = !docsLoaded; docsLoaded = true;
    status('실시간 연결됨');
    if (first) { migrateOldHistory(); autoPickDate(); }
    render();
  }, err => { console.error(err); status('연결 오류: ' + (err.code || err.message), true); });
}
Core.on('auth', subscribe);
Core.on('roster', render);
Core.on('reservations', () => { autoPickDate(); render(); });
Core.on('admin', render);
$('workDate').value = selDate;
subscribe();
render();
<\/script>
